oin('')}`:'';\n  openG('🔄 Resultado de la sincronización',`<p>${created} licencia(s) creada(s) · ${linked} vinculada(s). No se eliminó nada.<\/p>${sec('⚠ Correo distinto entre licencia y tienda',mism)}${sec('⚠ Licencias con tienda inexistente',orph)}${sec('⚠ Posibles licencias duplicadas (revísalas manualmente)',dups)}${(mism.length+orph.length+dups.length)?'':'<p class=\"muted mt\">Sin inconsistencias detectadas ✅<\/p>'}`);\n}\nfunction saveGraceDays(){\n  const val=parseInt($('graceDaysInput').value);\n  if(isNaN(val)||val<0)return toast('Valor inválido','red');\n  if(val>90)return toast('Máximo 90 días','red');\n  LS.setItem('ms52_grace_days',val);toast('Período de gracia actualizado: '+val+' días','green');\n  $('graceDaysInfo').textContent='Guardado: '+val+' días de gracia — '+new Date().toLocaleString('es-CO');\n}\n\n// ============================================================\n//  BIBLIOTECA IA — funciones internas del admin\n// ============================================================\nconst IA_LIB_KEY = 'ms52_ia_library'; // legacy key — ahora usa IndexedDB\n\n// ═══════════════════════════════════════════════════════════════\n//  CAPA IndexedDB — comparte la misma BD que medstore_v15\n//  Sin límite práctico (cientos de MB / GB según dispositivo)\n// ═══════════════════════════════════════════════════════════════\nconst IDB = (function(){\n  const DB_NAME='MedStoreAI', DB_VER=1, STORE='ia_library';\n  let _db=null;\n  function open(){\n    if(_db) return Promise.resolve(_db);\n    return new Promise((res,rej)=>{\n      const req=indexedDB.open(DB_NAME,DB_VER);\n      req.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'}); };\n      req.onsuccess=e=>{_db=e.target.result;res(_db);};\n      req.onerror=e=>rej(e.target.error);\n    });\n  }\n  async function getAll(){\n    const db=await open();\n    return new Promise((res,rej)=>{\n      const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll();\n      req.onsuccess=e=>{\n        let items=e.target.result||[];\n        const old=localStorage.getItem(IA_LIB_KEY);\n        if(old&&items.length===0){\n          try{\n            const parsed=JSON.parse(old);\n            if(Array.isArray(parsed)&&parsed.length>0){\n              console.log('[IDB admin] Migrando',parsed.length,'productos desde localStorage → IndexedDB...');\n              putAll(parsed).then(()=>{localStorage.removeItem(IA_LIB_KEY);console.log('[IDB admin] Migración ✅');});\n              items=parsed;\n            }\n          }catch(err){}\n        }\n        res(items);\n      };\n      req.onerror=e=>rej(e.target.error);\n    });\n  }\n  async function putAll(items){\n    const db=await open();\n    return new Promise((res,rej)=>{\n      const tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);\n      items.forEach(item=>{if(item&&item.id)st.put(item);});\n      tx.oncomplete=()=>res(); tx.onerror=e=>rej(e.target.error);\n    });\n  }\n  async function put(item){\n    const db=await open();\n    return new Promise((res,rej)=>{\n      const tx=db.transaction(STORE,'readwrite');\n      tx.objectStore(STORE).put(item);\n      tx.oncomplete=()=>res(); tx.onerror=e=>rej(e.target.error);\n    });\n  }\n  async function remove(id){\n    const db=await open();\n    return new Promise((res,rej)=>{\n      const tx=db.transaction(STORE,'readwrite');\n      tx.objectStore(STORE).delete(id);\n      tx.oncomplete=()=>res(); tx.onerror=e=>rej(e.target.error);\n    });\n  }\n  async function clear(){\n    const db=await open();\n    return new Promise((res,rej)=>{\n      const tx=db.transaction(STORE,'readwrite');\n      tx.objectStore(STORE).clear();\n      tx.oncomplete=()=>res(); tx.onerror=e=>rej(e.target.error);\n    });\n  }\n  async function getOne(id){\n    const db=await open();\n    return new Promise((res,rej)=>{\n      const req=db.transaction(STORE,'readonly').objectStore(STORE).get(id);\n      req.onsuccess=e=>res(e.target.result||null); req.onerror=e=>rej(e.target.error);\n    });\n  }\n  return {open,getAll,putAll,put,remove,clear,getOne};\n})();\n\nasync function getAdminLib(){ return IDB.getAll(); }\nasync function setAdminLib(lib){ await IDB.clear(); if(lib&&lib.length) await IDB.putAll(lib); }\n\nfunction compressImage(dataUrl,maxSize,quality){\n  maxSize=maxSize||800;quality=quality||0.7;\n  return new Promise(function(resolve){\n    const img=new Image();\n    img.onload=function(){\n      let w=img.width,h=img.height;\n      if(w>maxSize||h>maxSize){\n        if(w>=h){h=Math.round(h*maxSize/w);w=maxSize;}\n        else{w=Math.round(w*maxSize/h);h=maxSize;}\n      }\n      const canvas=document.createElement('canvas');\n      canvas.width=w;canvas.height=h;\n      canvas.getContext('2d').drawImage(img,0,0,w,h);\n      resolve(canvas.toDataURL('image/jpeg',quality));\n    };\n    img.onerror=function(){resolve(dataUrl);};\n    img.src=dataUrl;\n  });\n}\n\nlet _libImgsBuf = [];\n\nasync function renderLibGrid(){\n  const lib = await getAdminLib();\n  const q = (document.getElementById('libSearch')?.value||'').toLowerCase();\n  const filtered = q ? lib.filter(i=>\n    i.nombre.toLowerCase().includes(q)||\n    (i.categoria||'').toLowerCase().includes(q)||\n    (i.keywords||'').toLowerCase().includes(q)\n  ) : lib;\n  const countEl = document.getElementById('libCount');\n  if(countEl) countEl.textContent = lib.length+' producto(s) · '+lib.reduce((s,i)=>s+(i.imagenes||[]).length,0)+' imágenes';\n  const grid = document.getElementById('iaLibGrid');\n  if(!grid) return;\n  if(!filtered.length){\n    grid.innerHTML='<div style=\"grid-column:1/-1;text-align:center;padding:40px;color:var(--text2)\">'+(q?'Sin resultados para \"'+esc(q)+'\"':'Biblioteca vacía — agrega productos con el botón + Nuevo Producto')+'<\/div>';\n    return;\n  }\n  grid.innerHTML = filtered.map(item=>`\n    <div onclick=\"openLibModal(${item.id})\" style=\"background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s\" onmouseover=\"this.style.borderColor='#3b82f6'\" onmouseout=\"this.style.borderColor='var(--line)'\">\n      ${item.imagenes&&item.imagenes.length\n        ? `<img src=\"${item.imagenes[0]}\" style=\"width:100%;height:120px;object-fit:cover\">`\n        : `<div style=\"width:100%;height:120px;background:var(--bg3,#1a1f2e);display:flex;align-items:center;justify-content:center;font-size:36px\">🛍️<\/div>`}\n      <div style=\"padding:10px\">\n        <div style=\"font-weight:700;font-size:13px;margin-bottom:2px\">${esc(item.nombre)}<\/div>\n        <div style=\"font-size:11px;color:var(--text2)\">${esc(item.categoria||'Sin categoría')}<\/div>\n        <div style=\"font-size:11px;color:#3b82f6;margin-top:4px\">${(item.imagenes||[]).length} imagen(es)<\/div>\n        <div style=\"display:flex;gap:4px;margin-top:8px\" onclick=\"event.stopPropagation()\">\n          <button class=\"btn btn-sm btn-gray\" onclick=\"addLibImgDirect(${item.id})\">📷 +Foto<\/button>\n          <button class=\"btn btn-sm\" style=\"background:#ef444422;color:#fca5a5;border:1px solid #ef444433\" onclick=\"delLibItem(${item.id})\">🗑<\/button>\n        <\/div>\n      <\/div>\n    <\/div>`).join('');\n}\n\nasync function openLibModal(id){\n  _libImgsBuf = [];\n  const modal = document.getElementById('libModal');\n  if(id){\n    const item = (await getAdminLib()).find(i=>i.id===id);\n    if(!item) return;\n    _libImgsBuf = [...(item.imagenes||[])];\n    document.getElementById('libEditId').value = id;\n    document.getElementById('libNombre').value = item.nombre||'';\n    document.getElementById('libCat').value = item.categoria||'';\n    document.getElementById('libKeywords').value = item.keywords||'';\n    document.getElementById('libDesc').value = item.desc||'';\n    document.getElementById('libModalTitle').textContent = 'Editar: '+item.nombre;\n  } else {\n    document.getElementById('libEditId').value = '';\n    document.getElementById('libNombre').value = '';\n    document.getElementById('libCat').value = '';\n    document.getElementById('libKeywords').value = '';\n    document.getElementById('libDesc').value = '';\n    document.getElementById('libModalTitle').textContent = 'Nuevo Producto';\n  }\n  renderLibImgBuf();\n  modal.style.display = 'flex';\n}\n\nfunction closeLibModal(){\n  document.getElementById('libModal').style.display = 'none';\n}\n\nfunction renderLibImgBuf(){\n  const c = document.getElementById('libImgPreview');\n  if(!c) return;\n  c.innerHTML = _libImgsBuf.map((src,i)=>`\n    <div style=\"position:relative;width:70px;height:70px;overflow:visible;flex-shrink:0;\">\n      <img src=\"${src}\" style=\"width:70px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;\">\n      <button onclick=\"removeLibImg(${i})\" style=\"position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#ef4444;border:2px solid #fff;border-radius:50%;color:#fff;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;padding:0;\" title=\"Eliminar imagen\">✕<\/button>\n    <\/div>`).join('');\n  const cnt=document.getElementById('libImgCount');if(cnt)cnt.textContent='('+_libImgsBuf.length+')';\n}\n\nfunction removeLibImg(idx){ if(!confirm('¿Eliminar esta imagen del producto? Se aplicará al guardar.')) return; _libImgsBuf.splice(idx,1); renderLibImgBuf(); }\n\nasync function shaHexImg(s){return shaHex(s);}\nasync function filterNewImgs(existing,incoming){const seen=new Set(await Promise.all(existing.map(shaHexImg)));const out=[];let dup=0;for(const s of incoming){const h=await shaHexImg(s);if(seen.has(h))dup++;else{seen.add(h);out.push(s);}}return{out,dup};}\nfunction readFileAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f);});}\nasync function handleLibImgs(input){\n  const files=Array.from(input.files);input.value='';if(!files.length)return;\n  const comp=[];for(const f of files){try{comp.push(await compressImage(await readFileAsDataURL(f),800,0.7));}catch(e){toast('No se pudo leer '+f.name,'red');}}\n  const{out,dup}=await filterNewImgs(_libImgsBuf,comp);_libImgsBuf.push(...out);renderLibImgBuf();\n  if(dup)toast(dup+' imagen(es) duplicada(s) omitida(s)','yellow');\n}\n\nasync function saveLibItem(){\n  const nombre = document.getElementById('libNombre').value.trim();\n  if(!nombre){ alert('El nombre es requerido'); return; }\n  const editId = parseInt(document.getElementById('libEditId').value)||null;\n  let imagenesFinal=[..._libImgsBuf];\n  /* Se eliminó la fusión con imágenes antiguas: hacía que una imagen borrada reapareciera al guardar. */\n  const cur=editId?await IDB.getOne(editId):null;\n  const item = {\n    ...(cur||{}),\n    id: editId||Date.now(),\n    nombre,\n    categoria: document.getElementById('libCat').value.trim(),\n    keywords: document.getElementById('libKeywords').value.trim(),\n    desc: document.getElementById('libDesc').value.trim(),\n    imagenes: imagenesFinal,\n    updatedAt: new Date().toISOString()\n  };\n  if(!editId) item.createdAt=new Date().toISOString();\n  await IDB.put(item);\n  closeLibModal();\n  renderLibGrid();\n}\n\nasync function delLibItem(id){\n  if(!confirm('¿Eliminar este producto de la Biblioteca IA?')) return;\n  await IDB.remove(id);\n  renderLibGrid();\n}\n\nfunction addLibImgDirect(itemId){\n  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;\n  inp.onchange=async e=>{\n    const files=Array.from(e.target.files);if(!files.length)return;\n    const item=await IDB.getOne(itemId);if(!item)return toast('Producto no encontrado','red');\n    item.imagenes=item.imagenes||[];\n    const comp=[];for(const f of files){try{comp.push(await compressImage(await readFileAsDataURL(f),800,0.7));}catch(err){toast('No se pudo leer '+f.name,'red');}}\n    const{out,dup}=await filterNewImgs(item.imagenes,comp);\n    if(out.length){item.imagenes.push(...out);item.updatedAt=new Date().toISOString();await IDB.put(item);}\n    const editId=parseInt($('libEditId')&&$('libEditId').value)||null;\n    if(editId===itemId){_libImgsBuf=[...item.imagenes];renderLibImgBuf();}\n    renderLibGrid();if($('sec-ia_training').style.display!=='none')renderTraining();\n    toast(out.length+' imagen(es) añadida(s)'+(dup?' · '+dup+' duplicada(s) omitida(s)':''),out.length?'green':'yellow');\n  };\n  inp.click();\n}\n\nconst IA_LOG_KEY='ms52_ia_log';\nfunction getIaLog(){try{return JSON.parse(LS.getItem(IA_LOG_KEY)||'[]');}catch(e){return[];}}\nfunction addIaLog(e){const l=getIaLog();l.unshift({fecha:new Date().toISOString(),...e});l.length=Math.min(l.length,50);LS.setItem(IA_LOG_KEY,JSON.stringify(l));}\nasync function verificarBiblioteca(){\n  try{\n    const lib=await getAdminLib(),probs=[];\n    for(const it of lib){const imgs=it.imagenes||[],ps=[];\n      if(!imgs.length)ps.push('sin imágenes');else if(imgs.length<3)ps.push('menos de 3 imágenes');\n      const{dup}=await filterNewImgs([],imgs);if(dup)ps.push(dup+' imagen(es) duplicada(s)');\n      if(!it.desc&&!it.keywords)ps.push('sin descripción ni palabras clave');\n      if(ps.length)probs.push(it.nombre+': '+ps.join(', '));}\n    addIaLog({tipo:'Verificación de datos',productos:lib.length,problemas:probs.length,detalle:probs.slice(0,15).join(' | ')});\n    toast(probs.length?probs.length+' producto(s) con datos insuficientes':'Datos sin problemas detectados',probs.length?'yellow':'green');\n  }catch(e){addIaLog({tipo:'Verificación de datos',productos:0,problemas:0,detalle:'ERROR: '+e.message});toast('Error en la verificación: '+e.message,'red');}\n  renderTraining();\n}\nfunction renderIaLogCard(){\n  const l=getIaLog();\n  return `<div class=\"card\" style=\"margin-bottom:16px\"><h3 class=\"mb\" style=\"font-size:13px;font-weight:700\">🗒 Historial de verificaciones y entrenamientos<\/h3>${l.length?'<div class=\"history-block\" style=\"max-height:200px;overflow:auto;padding:6px 12px\">'+l.map(x=>`<div class=\"history-item\"><div class=\"hi-text\"><b>${esc(x.tipo)}<\/b> · ${x.productos} producto(s) · ${x.problemas} con problemas${x.detalle?'<br><span class=\"muted\">'+esc(x.detalle)+'<\/span>':''}<br><span class=\"muted\">No es un entrenamiento de modelo.<\/span><\/div><div class=\"hi-date\">${fmtDateTime(x.fecha)}<\/div><\/div>`).join('')+'<\/div>':'<p class=\"muted\" style=\"font-size:12px\">Sin registros. Aún no se ha ejecutado ningún entrenamiento ni verificación.<\/p>'}<\/div>`;\n}\n// ============================================================\n//  ENTRENAMIENTO IA\n// ============================================================\nasync function renderTraining(){\n  const lib = await getAdminLib();\n  const withImgs = lib.filter(i=>i.imagenes&&i.imagenes.length>0);\n  const totalImgs = lib.reduce((s,i)=>s+(i.imagenes||[]).length,0);\n  const container = document.getElementById('trainingContent');\n  if(!container) return;\n  container.innerHTML = `<div class=\"warn\">ℹ️ Subir imágenes <b>no entrena un modelo<\/b>: este panel solo administra la biblioteca que MedStore consulta. Entrenamientos ejecutados: <b>0<\/b> · Precisión: <b>no disponible<\/b> (no hay pruebas de reconocimiento registradas). Las verificaciones de abajo revisan la calidad de los datos, no entrenan nada.<\/div><div style=\"margin-bottom:12px\"><button class=\"btn btn-blue\" onclick=\"verificarBiblioteca()\">🔎 Verificar datos de la biblioteca<\/button><\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px\">\n      <div class=\"card\" style=\"text-align:center;padding:16px\">\n        <div style=\"font-size:28px;font-weight:800;color:#a855f7\">${withImgs.length}<\/div>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Productos con imágenes<\/div>\n      <\/div>\n      <div class=\"card\" style=\"text-align:center;padding:16px\">\n        <div style=\"font-size:28px;font-weight:800;color:#3b82f6\">${totalImgs}<\/div>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Total imágenes<\/div>\n      <\/div>\n      <div class=\"card\" style=\"text-align:center;padding:16px\">\n        <div style=\"font-size:28px;font-weight:800;color:#f59e0b\">${lib.length-withImgs.length}<\/div>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Sin imágenes<\/div>\n      <\/div>\n      <div class=\"card\" style=\"text-align:center;padding:16px\">\n        <div style=\"font-size:28px;font-weight:800;color:#22c55e\">${lib.length}<\/div>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Total biblioteca<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"card\" style=\"margin-bottom:16px\">\n      <h3 class=\"mb\" style=\"font-size:13px;font-weight:700\">📋 Estado del Entrenamiento<\/h3>\n      ${lib.length===0\n        ? '<p class=\"muted\">No hay productos en la Biblioteca IA. <button class=\"btn btn-sm btn-blue\" onclick=\"goSection(\\'ia_library\\')\">+ Ir a Biblioteca<\/button><\/p>'\n        : `<div style=\"overflow-x:auto\"><table style=\"width:100%;border-collapse:collapse;font-size:12px\">\n            <thead><tr style=\"border-bottom:1px solid var(--line)\">\n              <th style=\"padding:8px 10px;text-align:left;color:var(--text2)\">Producto<\/th>\n              <th style=\"padding:8px 10px;text-align:left;color:var(--text2)\">Categoría<\/th>\n              <th style=\"padding:8px 10px;text-align:center;color:var(--text2)\">Imágenes<\/th>\n              <th style=\"padding:8px 10px;text-align:left;color:var(--text2)\">Estado<\/th>\n              <th style=\"padding:8px 10px;text-align:left;color:var(--text2)\">Actualizado<\/th>\n              <th style=\"padding:8px 10px;text-align:left;color:var(--text2)\">Acción<\/th>\n            <\/tr><\/thead>\n            <tbody>${lib.map(item=>{\n              const imgs=(item.imagenes||[]).length;\n              const badge=imgs===0\n                ? '<span style=\"background:#ef444422;color:#fca5a5;border:1px solid #ef444433;border-radius:6px;padding:2px 8px;font-size:10px\">⚠️ Sin imágenes<\/span>'\n                : imgs<3\n                  ? '<span style=\"background:#f59e0b22;color:#fcd34d;border:1px solid #f59e0b33;border-radius:6px;padding:2px 8px;font-size:10px\">🔶 Básico<\/span>'\n                  : '<span style=\"background:#22c55e22;color:#86efac;border:1px solid #22c55e33;border-radius:6px;padding:2px 8px;font-size:10px\">✅ Imágenes suficientes<\/span>';\n              return `<tr style=\"border-bottom:1px solid var(--line)\">\n                <td style=\"padding:8px 10px;font-weight:600\">${esc(item.nombre)}<\/td>\n                <td style=\"padding:8px 10px;color:var(--text2)\">${esc(item.categoria||'—')}<\/td>\n                <td style=\"padding:8px 10px;text-align:center;font-weight:700;color:${imgs>0?'#22c55e':'#ef4444'}\">${imgs}<\/td>\n                <td style=\"padding:8px 10px\">${badge}<\/td>\n                <td style=\"padding:8px 10px;color:var(--text2)\">${fmtDate(item.updatedAt||item.createdAt)}<\/td>\n                <td style=\"padding:8px 10px\"><button class=\"btn btn-sm btn-gray\" onclick=\"addLibImgDirect(${item.id})\">📷 +Foto<\/button><\/td>\n              <\/tr>`;}).join('')}\n            <\/tbody><\/table><\/div>`}\n    <\/div>\n    ${renderIaLogCard()}\n    <div class=\"card\">\n      <h3 class=\"mb\" style=\"font-size:13px;font-weight:700\">💡 Recomendaciones<\/h3>\n      <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px\">\n        <div style=\"background:#3b82f611;border-left:3px solid #3b82f6;padding:10px 12px;border-radius:4px\">📌 Agrega <strong>mínimo 3 fotos<\/strong> por producto para mejor reconocimiento.<\/div>\n        <div style=\"background:#22c55e11;border-left:3px solid #22c55e;padding:10px 12px;border-radius:4px\">✅ Usa fotos desde diferentes ángulos: frontal, lateral, detalle del código.<\/div>\n        <div style=\"background:#f59e0b11;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:4px\">⚠️ Evita fotos borrosas o con poca luz.<\/div>\n      <\/div>\n    <\/div>`;\n}\n\n// ============================================================\n//  LICENCIAS ADMIN (vista interna)\n// ============================================================\n// ============================================================\n//  NOTIFICACIONES\n// ============================================================\nfunction getNotifTenants(){\n  return JSON.parse(localStorage.getItem('ms_global_tenants')||'[]');\n}\nfunction getNotificaciones(){\n  return JSON.parse(localStorage.getItem('ms52_notificaciones')||'[]');\n}\nfunction saveNotificaciones(list){\n  localStorage.setItem('ms52_notificaciones',JSON.stringify(list));\n}\nfunction toggleNotifTenant(){\n  const target=document.getElementById('notifTarget').value;\n  document.getElementById('notifTenantWrap').style.display = target==='privada' ? 'block' : 'none';\n}\nfunction notifTipoMeta(tipo){\n  const map={\n    info:{cl:'#3b82f6',bg:'#3b82f622',icon:'ℹ️',label:'Información'},\n    aviso:{cl:'#f59e0b',bg:'#f59e0b22',icon:'📢',label:'Aviso'},\n    urgente:{cl:'#ef4444',bg:'#ef444422',icon:'⚠️',label:'Urgente'},\n    exito:{cl:'#22c55e',bg:'#22c55e22',icon:'✅',label:'Éxito'},\n    vencimiento:{cl:'#f59e0b',bg:'#f59e0b22',icon:'⏰',label:'Vencimiento'},\n    renovacion:{cl:'#22c55e',bg:'#22c55e22',icon:'🔄',label:'Renovación'},\n    mantenimiento:{cl:'#a855f7',bg:'#a855f722',icon:'🛠',label:'Mantenimiento'},\n    novedad:{cl:'#3b82f6',bg:'#3b82f622',icon:'🆕',label:'Novedades'}\n  };\n  return map[tipo]||map.info;\n}\nfunction enviarNotificacion(){\n  const target=document.getElementById('notifTarget').value;\n  const tipo=document.getElementById('notifTipo').value;\n  const titulo=document.getElementById('notifTitulo').value.trim();\n  const mensaje=document.getElementById('notifMensaje').value.trim();\n  if(!titulo || !mensaje){ toast('Completa el título y el mensaje','red'); return; }\n\n  let tenantId=null, tenantName='Todos los usuarios';\n  if(target==='privada'){\n    const sel=document.getElementById('notifTenant');\n    tenantId=sel.value;\n    if(!tenantId){ toast('Selecciona una tienda/usuario','red'); return; }\n    tenantName=sel.options[sel.selectedIndex].text;\n  }\n\n  const list=getNotificaciones();\n  list.unshift({\n    id:'notif_'+Date.now(),\n    target, tenantId, tenantName,\n    tipo, titulo, mensaje,\n    fecha:new Date().toISOString(),\n    leida:false,\n    estado:'guardada'\n  });\n  saveNotificaciones(list);\n\n  document.getElementById('notifTitulo').value='';\n  document.getElementById('notifMensaje').value='';\n  toast('Notificación guardada en este navegador (no distribuida: requiere backend)','green');\n  renderNotificaciones();\n}\nfunction eliminarNotificacion(id){\n  if(!confirm('¿Eliminar esta notificación?')) return;\n  saveNotificaciones(getNotificaciones().filter(n=>n.id!==id));\n  renderNotificaciones();\n  toast('Notificación eliminada','yellow');\n}\nfunction renderNotificaciones(){\n  const container = document.getElementById('notifContent');\n  if(!container) return;\n\n  // poblar select de tiendas\n  const tenants=getNotifTenants();\n  const sel=document.getElementById('notifTenant');\n  sel.innerHTML = tenants.length\n    ? tenants.map(t=>`<option value=\"${esc(t.id)}\">${esc(t.storeName||t.ownerName||t.email||t.id)}<\/option>`).join('')\n    : '<option value=\"\">Sin tiendas registradas<\/option>';\n\n  const list=getNotificaciones();\n  const generales=list.filter(n=>n.target==='general').length;\n  const privadas=list.filter(n=>n.target==='privada').length;\n\n  if(!list.length){\n    container.innerHTML=`\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:20px 0\">\n        <div class=\"card\" style=\"text-align:center;padding:16px\">\n          <div style=\"font-size:28px;font-weight:800;color:#3b82f6\">0<\/div>\n          <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Generales<\/div>\n        <\/div>\n        <div class=\"card\" style=\"text-align:center;padding:16px\">\n          <div style=\"font-size:28px;font-weight:800;color:#a855f7\">0<\/div>\n          <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Privadas<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"card\"><p class=\"muted\">Aún no hay notificaciones guardadas.<\/p><\/div>`;\n    return;\n  }\n\n  container.innerHTML=`\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:20px 0\">\n      <div class=\"card\" style=\"text-align:center;padding:16px\">\n        <div style=\"font-size:28px;font-weight:800;color:#3b82f6\">${generales}<\/div>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Generales<\/div>\n      <\/div>\n      <div class=\"card\" style=\"text-align:center;padding:16px\">\n        <div style=\"font-size:28px;font-weight:800;color:#a855f7\">${privadas}<\/div>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Privadas<\/div>\n      <\/div>\n      <div class=\"card\" style=\"text-align:center;padding:16px\">\n        <div style=\"font-size:28px;font-weight:800;color:#22c55e\">${list.length}<\/div>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:4px\">Total guardadas<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"card\">\n      <h3 class=\"mb\" style=\"font-size:13px;font-weight:700\">🗂 Historial de notificaciones<\/h3>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        ${list.map(n=>{\n          const m=notifTipoMeta(n.tipo);\n          const destinoIcon = n.target==='general' ? '🌍' : '🔒';\n          return `<div style=\"background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                  <span style=\"background:${m.bg};color:${m.cl};border:1px solid ${m.cl}44;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700\">${m.icon} ${m.label}<\/span>\n                  <span style=\"font-size:11px;color:var(--text2)\">${destinoIcon} ${n.target==='general'?'General · todos los usuarios':esc(n.tenantName)}<\/span>\n                  <span style=\"font-size:10px;color:var(--text3)\">💾 Guardada (local) · envío y recepción no verificables<\/span>\n                <\/div>\n                <div style=\"font-weight:700;font-size:13px;margin-top:6px\">${esc(n.titulo)}<\/div>\n                <div style=\"font-size:12px;color:var(--text2);margin-top:3px\">${esc(n.mensaje)}<\/div>\n                <div style=\"font-size:10px;color:var(--text3);margin-top:6px\">${new Date(n.fecha).toLocaleString('es-CO')}<\/div>\n              <\/div>\n              <button class=\"btn btn-sm btn-red\" onclick=\"eliminarNotificacion('${n.id}')\">🗑<\/button>\n            <\/div>\n          <\/div>`;\n        }).join('')}\n      <\/div>\n    <\/div>`;\n}\n\nfunction openApp(){ /* deprecated — sections now load internally */ }\nfunction notifPlantilla(){\n  const T={vencimiento:['Tu licencia está por vencer','Tu licencia de MedStore vence pronto. Renueva a tiempo para no perder el acceso.'],renovacion:['Renovación registrada','Hemos registrado la renovación de tu licencia. ¡Gracias por continuar con MedStore!'],mantenimiento:['Mantenimiento programado','Realizaremos tareas de mantenimiento. Es posible que el servicio tenga interrupciones breves.'],novedad:['Novedades en MedStore','Tenemos nuevas funciones disponibles. Descubre qué hay de nuevo.']};\n  const t=T[$('notifTipo').value];if(!t)return toast('Este tipo no tiene plantilla','yellow');$('notifTitulo').value=t[0];$('notifMensaje').value=t[1];\n}\n\n/* ===== INIT ===== */\n(function init(){\n  const m=getAdminMeta();\n  if(m&&(m.secAnswerHash||m.emergencyCodeHash)){delete m.secAnswerHash;delete m.emergencyCodeHash;saveAdminMeta(m);addSecurityEvent('🛡','Eliminados la pregunta de seguridad y el código de emergencia antiguos (inseguros). Genera una clave de recuperación nueva.','yellow');}\n  if(sessOk()){const mm=getAdminMeta();if(mm){mm.lastAccess=new Date().toISOString();saveAdminMeta(mm);}enterApp();}\n  else checkPwdSetup();\n})();\n\n<\/script>\n<script>addEventListener('keydown',function(e){if(e.key==='F7'){e.preventDefault();parent.postMessage('msbio-f7','*')}},true)<\/script>\n<\/body>\n<\/html>\n";
const K='ms52_bio',$=id=>document.getElementById(id);
const ov=$('msbio'),fr=$('msbioFrame'),gate=$('msbioGate'),vid=$('msbioVid'),msg=$('msbioMsg'),ttl=$('msbioTitle'),btns=$('msbioBtns');
let stream=null,fm=null,resolver=null,tok=0;
const sleep=t=>new Promise(r=>setTimeout(r,t));
const bio=()=>{try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
function setMsg(t,c){msg.textContent=t;msg.style.color=c||'#e5e7eb'}
function setBtns(a){btns.innerHTML='';a.forEach(([t,f,c])=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=f;btns.appendChild(b)})}
function show(w){gate.classList.toggle('on',w==='gate');fr.style.display=w==='app'?'block':'none'}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar el motor de reconocimiento (¿sin internet?)'));document.head.appendChild(s)})}
async function engine(){
  if(fm)return;
  const B='https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
  if(!window.FaceMesh)await loadScript(B+'face_mesh.js');
  const m=new FaceMesh({locateFile:f=>B+f});
  m.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.6,minTrackingConfidence:.6});
  m.onResults(r=>{if(resolver){const f=resolver;resolver=null;f((r.multiFaceLandmarks&&r.multiFaceLandmarks[0])||null)}});
  await m.initialize();fm=m;
}
const detect=()=>new Promise(async res=>{resolver=res;try{await fm.send({image:vid})}catch(e){resolver=null;res(null)}});
async function cam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Este navegador/contexto no permite usar la cámara');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
  vid.srcObject=stream;vid.style.display='block';await vid.play();
}
function camOff(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.srcObject=null;vid.style.display='none'}
/* ── Rasgos ── */
const px=(L,i)=>({x:L[i].x*vid.videoWidth,y:L[i].y*vid.videoHeight});
const dp=(L,i,j)=>{const a=px(L,i),b=px(L,j);return Math.hypot(a.x-b.x,a.y-b.y)};
const frontal=L=>{const l=dp(L,1,33),r=dp(L,1,263);return Math.abs(l-r)/(l+r)<0.09};
const ear=L=>(dp(L,159,145)/dp(L,33,133)+dp(L,386,374)/dp(L,362,263))/2;
function faceSig(L){
  const W=vid.videoWidth,H=vid.videoHeight,P=L.slice(0,468).map(p=>({x:p.x*W,y:p.y*H,z:p.z*W}));
  const A=P[33],B=P[263],s=Math.hypot(B.x-A.x,B.y-A.y),th=Math.atan2(B.y-A.y,B.x-A.x),c=Math.cos(-th),sn=Math.sin(-th);
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,mz=(A.z+B.z)/2,o=[];
  for(const p of P){const x=(p.x-mx)/s,y=(p.y-my)/s;o.push(+(x*c-y*sn).toFixed(4),+(x*sn+y*c).toFixed(4),+((p.z-mz)/s).toFixed(4))}
  return o;
}
const fdist=(a,b)=>{let s=0;for(let i=0;i<a.length;i+=3)s+=Math.hypot(a[i]-b[i],a[i+1]-b[i+1],(a[i+2]-b[i+2])*.5);return s/(a.length/3)};
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function irisSig(L){
  const io=dp(L,33,263),dia=c=>(dp(L,c+1,c+3)+dp(L,c+2,c+4))/2;
  const g=[dia(468)/io,dia(473)/io,dia(468)/dp(L,33,133),dia(473)/dp(L,362,263)];
  cv.width=vid.videoWidth;cv.height=vid.videoHeight;cx.drawImage(vid,0,0);
  let R=0,G=0,B=0,n=0;
  for(const c of[468,473]){const o=px(L,c),r=dia(c)/2;
    for(const f of[.5,.7])for(let k=0;k<16;k++){const t=k*Math.PI/8,x=Math.round(o.x+Math.cos(t)*r*f),y=Math.round(o.y+Math.sin(t)*r*f);
      if(x<0||y<0||x>=cv.width||y>=cv.height)continue;const d=cx.getImageData(x,y,1,1).data,br=d[0]+d[1]+d[2];
      if(br<90||br>690)continue;R+=d[0];G+=d[1];B+=d[2];n++}}
  if(n<12)return null;const s=R+G+B;return{g,c:[R/s,G/s]};
}
const irisDist=(a,b)=>({g:a.g.reduce((s,v,i)=>s+Math.abs(v-b.g[i])/b.g[i],0)/a.g.length,c:Math.hypot(a.c[0]-b.c[0],a.c[1]-b.c[1])});
/* ── Verificación (rostro + iris + parpadeo anti-foto) ── */
async function matchLoop(my){
  const b=bio(),th=+localStorage.getItem('ms52_bio_th')||0.06;let ref=0,blink=false,ok=false;const t0=Date.now();
  while(my===tok&&Date.now()-t0<30000){
    const L=await detect();await sleep(60);if(my!==tok)return false;
    if(!L){setMsg('No detecto tu rostro…');continue}
    if(!frontal(L)){setMsg('Mira de frente a la cámara');continue}
    const e=ear(L);ref=Math.max(ref,e);
    if(e<ref*.6){blink=true;continue}
    if(e<ref*.8)continue;
    const fd=fdist(faceSig(L),b.face),is=irisSig(L);if(!is)continue;
    const id=irisDist(is,b.iris);
    ok=ok||(fd<=th&&id.g<.12&&id.c<.05);
    if(ok&&blink)return true;
    setMsg(ok?'✔ Rostro e iris coinciden — parpadea una vez para confirmar':'Rostro '+fd.toFixed(3)+' (máx '+th+') · Iris '+id.g.toFixed(2)+' / color '+id.c.toFixed(3));
  }
  return false;
}
function verifyFlow(){
  const my=++tok;show('gate');ttl.textContent='🛡 Verificación de identidad';
  return new Promise(async res=>{
    const fin=v=>{tok++;camOff();res(v)};
    setBtns([['Cancelar',()=>fin(false),'d'],['Código de emergencia',async()=>{const c=prompt('Código de emergencia:');if(!c)return;if(await sha(c.trim().toUpperCase())===bio().emerg)fin(true);else setMsg('Código incorrecto','#f87171')}]]);
    try{setMsg('Cargando motor de reconocimiento (la primera vez requiere internet)…');await engine();await cam()}
    catch(e){setMsg('⚠ '+(e.message||e)+'. Puedes usar el código de emergencia.','#f87171');return}
    setMsg('Mira de frente a la cámara, con buena luz');
    const r=await matchLoop(my);if(my!==tok)return;
    if(r)fin(true);else{setMsg('✖ No se pudo verificar tu identidad.','#f87171');await sleep(2200);if(my===tok)fin(false)}
  });
}
/* ── Registro ── */
async function registerFlow(){
  const my=++tok,N=6;show('gate');ttl.textContent='📸 Registro de rostro e iris';
  setBtns([['Cancelar',bioMenu,'d']]);
  try{setMsg('Cargando motor…');await engine();await cam()}catch(e){setMsg('⚠ '+(e.message||e),'#f87171');setBtns([['Volver',bioMenu]]);return}
  const F=[],I=[];
  while(my===tok&&F.length<N){
    setMsg('Mira de frente, ojos bien abiertos y buena luz ('+F.length+'/'+N+')');
    const L=await detect();await sleep(450);if(my!==tok)return;
    if(!L||!frontal(L)||ear(L)<.15)continue;const is=irisSig(L);if(!is)continue;
    F.push(faceSig(L));I.push(is);
  }
  if(my!==tok)return;
  const mean=a=>a[0].map((_,i)=>a.reduce((s,v)=>s+v[i],0)/a.length);
  const code=Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');
  localStorage.setItem(K,JSON.stringify({v:1,date:Date.now(),face:mean(F).map(v=>+v.toFixed(4)),iris:{g:mean(I.map(i=>i.g)),c:mean(I.map(i=>i.c))},emerg:await sha(code)}));
  camOff();alert('✅ Rostro e iris registrados.\n\nCÓDIGO DE EMERGENCIA (guárdalo, solo se muestra una vez):\n\n'+code);
  bioMenu();
}
function bioMenu(){
  tok++;camOff();show('gate');ttl.textContent='🛡 Seguridad biométrica';const b=bio();
  setMsg((b?'✅ Registrado el '+new Date(b.date).toLocaleString()+'. Al pulsar F7 se pedirá rostro + iris + parpadeo, y luego la contraseña.':'Sin registro: hoy solo protege la contraseña.')+'\n\n⚠ Con una cámara común el iris se aproxima (tamaño, proporciones y color); el iris real requiere cámara infrarroja. Los datos quedan solo en este navegador.');
  msg.style.whiteSpace='pre-line';
  setBtns([[b?'Volver a registrar':'Registrar rostro e iris',registerFlow,'p'],...(b?[['Eliminar registro',()=>{if(confirm('¿Eliminar el registro biométrico?')){localStorage.removeItem(K);bioMenu()}},'d']]:[]),['Volver al panel',()=>show('app')]]);
}
function sessOk(){try{const s=JSON.parse(fr.contentWindow.sessionStorage.getItem('ms52_admin_session2'));return !!s&&Date.now()-s.last<30*60000}catch(e){return false}}
$('msbioBioBtn').onclick=()=>{if(!sessOk())return alert('Primero inicia sesión en el panel con tu contraseña.');bioMenu()};
function close(){tok++;camOff();ov.classList.remove('on');$('msbioBioBtn').style.display='none';fr.removeAttribute('srcdoc');fr.src='about:blank';fr.style.display='none';document.documentElement.style.overflow=''}
async function toggle(){
  if(ov.classList.contains('on'))return close();
  ov.classList.add('on');document.documentElement.style.overflow='hidden';
  if(bio()&&!(await verifyFlow()))return close();
  show('app');fr.removeAttribute('src');fr.srcdoc=ADMIN;$('msbioBioBtn').style.display='';
}
$('msbioClose').onclick=close;
$('lockBtn').onclick=toggle;
window.addEventListener('keydown',e=>{if(e.key==='F7'){e.preventDefault();e.stopPropagation();toggle()}},true);
window.addEventListener('message',e=>{if(e.data==='msbio-f7')toggle()});
toggle(); /* panel independiente: al abrir la página se solicita la verificación */
})();
</script>
