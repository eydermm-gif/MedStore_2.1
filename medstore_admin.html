>Licencias<\/option><option value=\"1\">🗑 Papelera<\/option><\/select>\n            <select id=\"fSort\" onchange=\"renderTable()\" style=\"width:auto\">\n              <option value=\"venc\">Ordenar por vencimiento<\/option>\n              <option value=\"nombre\">Ordenar por nombre<\/option>\n              <option value=\"creada\">Más recientes<\/option>\n            <\/select>\n            <button class=\"btn btn-sm btn-green\" onclick=\"openNew()\">+ Nueva licencia<\/button>\n          <\/div>\n          <div class=\"tbl-wrap\">\n            <table>\n              <thead><tr>\n                <th>#<\/th><th>Cliente<\/th><th>Usuario<\/th><th>Tienda / ID<\/th><th>Plan<\/th><th>Estado<\/th>\n                <th>Inicio<\/th><th>Vence<\/th><th>Días<\/th><th>Acciones<\/th>\n              <\/tr><\/thead>\n              <tbody id=\"tbody\"><\/tbody>\n            <\/table>\n          <\/div>\n          <div class=\"pager\">\n            <button onclick=\"changePage(-1)\" id=\"pPrev\">‹ Anterior<\/button>\n            <span id=\"pInfo\" class=\"muted\"><\/span>\n            <button onclick=\"changePage(1)\" id=\"pNext\">Siguiente ›<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <\!-- ===== HERRAMIENTAS ===== -->\n      <div id=\"sec-tools\" style=\"display:none\">\n        <div style=\"max-width:500px\">\n          <div class=\"card\">\n            <h3 class=\"mb\">⏳ Período de Gracia para Empleados<\/h3>\n            <p class=\"muted mb\">Días que los empleados pueden usar el sistema después del vencimiento de licencia.<\/p>\n            <label>Días de gracia (default: 7)<\/label>\n            <input id=\"graceDaysInput\" type=\"number\" min=\"0\" max=\"90\" value=\"7\" class=\"mb\">\n            <button class=\"btn btn-green\" onclick=\"saveGraceDays()\">💾 Guardar días de gracia<\/button>\n            <p class=\"muted mt\" id=\"graceDaysInfo\" style=\"font-size:11px\"><\/p>\n          <\/div>\n          <div class=\"card\">\n            <h3 class=\"mb\">💾 Copias de seguridad / Importar<\/h3>\n            <p class=\"muted mb\">La copia incluye licencias, tiendas, notificaciones y datos privados de cada tienda. <b>Nunca incluye contraseñas.<\/b> La Biblioteca IA (IndexedDB) no está incluida.<\/p>\n            <div class=\"flex mb\"><button class=\"btn btn-blue\" onclick=\"exportar()\">📥 Crear y descargar copia<\/button><button class=\"btn btn-gray btn-sm\" onclick=\"verLogImport()\">📋 Registro de importaciones<\/button><\/div>\n            <label>Restaurar / importar archivo JSON (se valida antes de aplicar)<\/label>\n            <input type=\"file\" id=\"impFile\" accept=\".json,application/json\" class=\"mb\">\n            <div class=\"flex\">\n              <button class=\"btn btn-gray btn-sm\" onclick=\"importar('merge')\">Fusionar<\/button>\n              <button class=\"btn btn-red btn-sm\" onclick=\"importar('reemplazar')\">Reemplazar todo<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"card\">\n            <h3 class=\"mb\">🔄 Sincronizar tenants<\/h3>\n            <p class=\"muted mb\">Vincula cada tienda con su licencia (por ID de tienda), crea las que falten y reporta inconsistencias. No borra nada.<\/p>\n            <button class=\"btn btn-yellow\" onclick=\"sincronizar()\">🔄 Sincronizar<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <\!-- ===== CONFIGURACIÓN SUPER ADMIN ===== -->\n      <div id=\"sec-config\" style=\"display:none\">\n        <div class=\"config-section\">\n\n          <\!-- INFO CUENTA -->\n          <div class=\"card\" style=\"border-color:#a855f744\">\n            <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px\">\n              <div style=\"width:52px;height:52px;background:linear-gradient(135deg,var(--primary),#7c3aed);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0\">🏭<\/div>\n              <div>\n                <div style=\"font-size:17px;font-weight:700\">Dueño de MedStore<\/div>\n                <div style=\"font-size:12px;color:var(--primary);margin-top:2px\">Super Administrador · Acceso total<\/div>\n              <\/div>\n              <div style=\"margin-left:auto\"><span class=\"badge b-act\">● Activo<\/span><\/div>\n            <\/div>\n\n            <div class=\"grid grid-2\">\n              <div class=\"info-block\">\n                <div style=\"font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600\">📋 Información de la cuenta<\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Rol<\/span><span class=\"info-val\">🏭 Super Admin<\/span><\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Fecha de creación<\/span><span class=\"info-val\" id=\"infoCreatedAt\">—<\/span><\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Último acceso<\/span><span class=\"info-val\" id=\"infoLastAccess\">—<\/span><\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Correo de contacto<\/span><span class=\"info-val\" id=\"infoRecoveryEmail\">—<\/span><\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Clave de recuperación<\/span><span class=\"info-val\" id=\"infoRecoveryKey\">—<\/span><\/div>\n              <\/div>\n              <div class=\"info-block\">\n                <div style=\"font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600\">🖥 Estado del sistema<\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Versión<\/span><span class=\"info-val\">MedStore v12<\/span><\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Panel Admin<\/span><span class=\"info-val\">v7.0<\/span><\/div>\n                <div class=\"info-row\">\n                  <span class=\"info-key\">Estado<\/span>\n                  <span class=\"info-val\"><span class=\"status-dot green\"><\/span>Operativo<\/span>\n                <\/div>\n                <div class=\"info-row\"><span class=\"info-key\">Total tenants<\/span><span class=\"info-val\" id=\"infoTenants\">—<\/span><\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <\!-- ACCESOS DIRECTOS -->\n          <div class=\"card\">\n            <div style=\"font-size:13px;font-weight:700;margin-bottom:10px\">⚡ Accesos directos al panel<\/div>\n            <div class=\"grid grid-4\" style=\"gap:8px\">\n              <div onclick=\"goSection('ia_library')\" style=\"background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-size:12px;cursor:pointer;transition:.2s\" onmouseover=\"this.style.borderColor='#a855f7'\" onmouseout=\"this.style.borderColor='var(--line)'\">\n                <div style=\"font-size:18px;margin-bottom:4px\">🧠<\/div>Biblioteca IA\n                <div style=\"margin-top:5px;font-size:10px;color:var(--text2)\">↗ Abrir<\/div>\n              <\/div>\n              <div onclick=\"goSection('ia_training')\" style=\"background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-size:12px;cursor:pointer;transition:.2s\" onmouseover=\"this.style.borderColor='#a855f7'\" onmouseout=\"this.style.borderColor='var(--line)'\">\n                <div style=\"font-size:18px;margin-bottom:4px\">🎓<\/div>Entrenamiento IA\n                <div style=\"margin-top:5px;font-size:10px;color:var(--text2)\">↗ Abrir<\/div>\n              <\/div>\n              <div onclick=\"goSection('notificaciones')\" style=\"background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-size:12px;cursor:pointer;transition:.2s\" onmouseover=\"this.style.borderColor='#a855f7'\" onmouseout=\"this.style.borderColor='var(--line)'\">\n                <div style=\"font-size:18px;margin-bottom:4px\">🔔<\/div>Notificaciones\n                <div style=\"margin-top:5px;font-size:10px;color:var(--text2)\">↗ Abrir<\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <\!-- SEGURIDAD DEL PANEL GLOBAL -->\n          <div class=\"security-block\">\n            <h3>🔐 Seguridad del Panel Global<\/h3>\n            <div class=\"grid grid-2\" style=\"margin-bottom:14px\">\n              <div>\n                <label>Contraseña actual<\/label>\n                <input id=\"cpOld\" type=\"password\" placeholder=\"••••••••\" class=\"mb\">\n                <label>Nueva contraseña<\/label>\n                <input id=\"cpNew\" type=\"password\" placeholder=\"Mínimo 8 caracteres\" class=\"mb\" autocomplete=\"new-password\">\n                <label>Confirmar nueva contraseña<\/label>\n                <input id=\"cpNew2\" type=\"password\" placeholder=\"Repite la nueva contraseña\" class=\"mb\">\n              <\/div>\n              <div>\n                <div style=\"background:#0b0f1a;border:1px solid var(--line);border-radius:8px;padding:14px;height:100%\">\n                  <div style=\"font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:600\">Requisitos de seguridad<\/div>\n                  <div style=\"font-size:12px;color:var(--text2);line-height:1.8\">\n                    ✅ Mínimo 8 caracteres, tal cual se escriben<br>\n                    ✅ PBKDF2-SHA-256 con sal<br>\n                    ✅ Bloqueo progresivo tras 3 fallos<br>\n                    ✅ Sesión: 30 min de inactividad<br>\n                    ⚠️ Sin backend no es seguridad de producción\n                  <\/div>\n                <\/div>\n              <\/div>\n            <\/div>\n            <div class=\"flex\">\n              <button class=\"btn\" onclick=\"cambiarPwd()\">💾 Guardar cambios<\/button>\n              <button class=\"btn btn-red\" onclick=\"showResetFromConfig()\">🔄 Restablecer contraseña maestra<\/button>\n            <\/div>\n            <div id=\"pwdFeedback\" style=\"margin-top:10px;font-size:12px;display:none\"><\/div>\n          <\/div>\n\n          <\!-- RECUPERACIÓN DE CONTRASEÑA -->\n          <div class=\"recovery-block\">\n            <h3>🔑 Recuperación de acceso<\/h3>\n            <p class=\"muted mb\">Se usa una <b>clave de recuperación aleatoria de un solo uso<\/b> (se guarda solo su hash). Ya no existen preguntas de seguridad ni códigos fijos. La recuperación por correo requiere un backend.<\/p>\n            <label>Correo de contacto (informativo)<\/label>\n            <input id=\"cfgRecoveryEmail\" type=\"email\" placeholder=\"tu@correo.com\" class=\"mb\">\n            <div class=\"flex\"><button class=\"btn btn-green\" onclick=\"saveRecoveryConfig()\">💾 Guardar correo<\/button><button class=\"btn btn-yellow\" onclick=\"regenRecoveryKey()\">🎲 Generar nueva clave de recuperación<\/button><\/div>\n          <\/div>\n\n          <\!-- HISTORIAL DE SEGURIDAD -->\n          <div class=\"card\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n              <div style=\"font-size:13px;font-weight:700\">📋 Historial de cambios de seguridad<\/div>\n              <button class=\"btn btn-sm btn-gray\" onclick=\"clearSecurityLog()\">🗑 Limpiar<\/button>\n            <\/div>\n            <div id=\"securityHistory\" class=\"history-block\" style=\"max-height:220px;overflow:auto;padding:0\">\n              <div style=\"text-align:center;padding:20px;color:var(--text3);font-size:13px\">Sin registros aún<\/div>\n            <\/div>\n          <\/div>\n\n        <\/div>\n      <\/div>\n\n\n      <\!-- ===== BIBLIOTECA IA ===== -->\n      <div id=\"sec-ia_library\" style=\"display:none\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px\">\n          <div>\n            <h2 style=\"margin:0;font-size:18px\">🧠 Biblioteca IA Global<\/h2>\n            <p class=\"muted\" style=\"margin:4px 0 0\">Base de conocimiento visual para reconocimiento de productos<\/p>\n          <\/div>\n          <button class=\"btn btn-blue\" onclick=\"openLibModal()\">+ Nuevo Producto<\/button>\n        <\/div>\n        <div class=\"card\" style=\"margin-bottom:16px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <input type=\"text\" id=\"libSearch\" placeholder=\"🔍 Buscar en biblioteca...\" oninput=\"renderLibGrid()\"\n              style=\"flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none\">\n            <span id=\"libCount\" class=\"muted\" style=\"font-size:12px;white-space:nowrap\">0 productos<\/span>\n          <\/div>\n        <\/div>\n        <div id=\"iaLibGrid\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px\"><\/div>\n\n        <\!-- Modal biblioteca -->\n        <div id=\"libModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;align-items:center;justify-content:center;padding:20px\">\n          <div style=\"background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)\">\n              <h3 id=\"libModalTitle\" style=\"margin:0;font-size:15px\">Nuevo Producto<\/h3>\n              <button onclick=\"closeLibModal()\" style=\"background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer\">✕<\/button>\n            <\/div>\n            <div style=\"padding:20px;display:flex;flex-direction:column;gap:12px\">\n              <input type=\"hidden\" id=\"libEditId\">\n              <div>\n                <label style=\"font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase\">Nombre del producto *<\/label>\n                <input id=\"libNombre\" type=\"text\" placeholder=\"Ej: Pijama Satín Rosa talla M\"\n                  style=\"width:100%;background:var(--bg3,#1a1f2e);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none\">\n              <\/div>\n              <div>\n                <label style=\"font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase\">Categoría<\/label>\n                <input id=\"libCat\" type=\"text\" placeholder=\"Ej: Pijamas, Maquillaje, Medias...\"\n                  style=\"width:100%;background:var(--bg3,#1a1f2e);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none\">\n              <\/div>\n              <div>\n                <label style=\"font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase\">Palabras clave<\/label>\n                <input id=\"libKeywords\" type=\"text\" placeholder=\"pijama, satín, rosa, short...\"\n                  style=\"width:100%;background:var(--bg3,#1a1f2e);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none\">\n              <\/div>\n              <div>\n                <label style=\"font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase\">Descripción<\/label>\n                <textarea id=\"libDesc\" rows=\"3\" placeholder=\"Características visuales: color, estampado, empaque, etiqueta...\"\n                  style=\"width:100%;background:var(--bg3,#1a1f2e);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:vertical\"><\/textarea>\n              <\/div>\n              <div>\n                <label style=\"font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:6px;text-transform:uppercase\">Imágenes de entrenamiento <span id=\"libImgCount\" style=\"color:#3b82f6;font-weight:800;\">(0)<\/span><\/label>\n                <div id=\"libImgPreview\" style=\"display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px;min-height:40px;border:1px dashed var(--line);border-radius:8px;padding:12px 10px 8px 10px;overflow:visible\"><\/div>\n                <input type=\"file\" id=\"libImgInput\" accept=\"image/*\" multiple style=\"display:none\" onchange=\"handleLibImgs(this)\">\n                <button class=\"btn btn-sm btn-gray\" onclick=\"document.getElementById('libImgInput').click()\">📷 Subir imágenes<\/button>\n                <span style=\"font-size:11px;color:var(--text2);margin-left:6px\">Sin límite — sube todas las que quieras<\/span>\n              <\/div>\n            <\/div>\n            <div style=\"padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end\">\n              <button class=\"btn btn-gray\" onclick=\"closeLibModal()\">Cancelar<\/button>\n              <button class=\"btn btn-green\" onclick=\"saveLibItem()\">💾 Guardar<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <\!-- ===== ENTRENAMIENTO IA ===== -->\n      <div id=\"sec-ia_training\" style=\"display:none\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px\">\n          <div>\n            <h2 style=\"margin:0;font-size:18px\">🎓 Centro de Entrenamiento IA<\/h2>\n            <p class=\"muted\" style=\"margin:4px 0 0\">Gestiona y mejora el reconocimiento visual de productos<\/p>\n          <\/div>\n          <button class=\"btn btn-blue\" onclick=\"goSection('ia_library')\">📚 Ir a Biblioteca<\/button>\n        <\/div>\n        <div id=\"trainingContent\"><\/div>\n      <\/div>\n\n      <\!-- ===== LICENCIAS ADMIN ===== -->\n      <\!-- ===== ARQUITECTURA SAAS ===== -->\n      <div id=\"sec-arq\" style=\"display:none\"><div class=\"config-section\">\n        <div class=\"card\"><h2 style=\"font-size:18px;margin-bottom:8px\">🏗 Preparación para vender MedStore como SaaS<\/h2>\n          <div class=\"warn\">Estado actual: <b>sin backend<\/b>. Todo se guarda en el <code>localStorage<\/code> / IndexedDB de este navegador: es privado de ese navegador, no se comparte entre dispositivos y puede borrarse. No hay base de datos central ni una autenticación que un servidor pueda hacer cumplir.<\/div>\n          <h3 style=\"font-size:14px;margin:14px 0 6px\">Separación necesaria<\/h3>\n          <div class=\"tbl-wrap\"><table><thead><tr><th>Dominio<\/th><th>Hoy<\/th><th>Con backend<\/th><\/tr><\/thead><tbody>\n          <tr><td>Panel Super Admin<\/td><td>Hash local + sesión del navegador<\/td><td>Login en servidor (Argon2/bcrypt), 2FA, sesiones/JWT, auditoría<\/td><\/tr>\n          <tr><td>Clientes y licencias<\/td><td><code>ms52_licencias<\/code><\/td><td>Tablas <code>tenants<\/code>, <code>licenses<\/code>, <code>license_events<\/code><\/td><\/tr>\n          <tr><td>Cuentas y permisos<\/td><td><code>ms_&lt;tenant&gt;_users_admin<\/code> (la app aún lee <code>pwd<\/code>)<\/td><td>Tabla <code>users<\/code> con hash, roles y <code>tenant_id<\/code> obligatorio<\/td><\/tr>\n          <tr><td>Datos privados de tienda<\/td><td>Claves <code>ms_&lt;tenant&gt;_*<\/code><\/td><td>Esquema por tenant o Row-Level Security: cada petición filtra por el <code>tenant_id<\/code> del token<\/td><\/tr>\n          <tr><td>Biblioteca / entrenamiento IA<\/td><td>IndexedDB <code>MedStoreAI<\/code><\/td><td>Almacenamiento de objetos (S3) + tabla de metadatos y trabajos de entrenamiento<\/td><\/tr>\n          <tr><td>Notificaciones<\/td><td><code>ms52_notificaciones<\/code> (solo guardadas)<\/td><td>Tabla <code>notifications<\/code> + <code>deliveries<\/code> (enviada/recibida/leída) y correo/push<\/td><\/tr>\n          <tr><td>Historial y copias<\/td><td>Archivos JSON manuales<\/td><td>Backups automáticos de la BD y log de auditoría inmutable<\/td><\/tr><\/tbody><\/table><\/div>\n          <h3 style=\"font-size:14px;margin:14px 0 6px\">Contrato de API propuesto (no implementado)<\/h3>\n          <div class=\"info-block\" style=\"font-family:monospace;font-size:12px;line-height:1.7\">POST /auth/login · /auth/logout · /auth/password/reset<br>GET/POST /licenses · PATCH /licenses/:id (no toca vencimiento)<br>POST /licenses/:id/renew · /suspend · /reactivate · /cancel<br>GET /licenses/:id/events<br>POST /notifications · GET /notifications/:id/deliveries<br>GET/PUT /tenants/:id/ia/library · POST /tenants/:id/ia/training-jobs<br>Toda ruta de tienda: <i>tenant_id<\/i> sale del token, nunca del cliente.<\/div>\n          <h3 style=\"font-size:14px;margin:14px 0 6px\">Qué seguirá dependiendo del servidor<\/h3>\n          <p class=\"muted\" style=\"font-size:13px;line-height:1.7\">Autenticación segura y recuperación por correo · aislamiento real entre tiendas · último acceso y número real de usuarios · entrega y recepción de notificaciones · bloqueo de acceso de una tienda vencida/suspendida · copias automáticas · entrenamiento real del modelo de reconocimiento.<\/p>\n          <p class=\"muted\" style=\"font-size:12px;margin-top:10px\">Backend configurado: <b style=\"color:var(--red)\">ninguno<\/b><\/p><\/div>\n      <\/div><\/div>\n\n      <\!-- ===== NOTIFICACIONES ===== -->\n      <div id=\"sec-notificaciones\" style=\"display:none\">\n        <div style=\"margin-bottom:20px\">\n          <h2 style=\"margin:0;font-size:18px\">🔔 Notificaciones<\/h2>\n          <p class=\"muted\" style=\"margin:4px 0 0\">Prepara avisos generales o para una tienda específica<\/p>\n          <div class=\"warn mt\">Las notificaciones se <b>guardan en este navegador<\/b>. Este panel no las distribuye a otras tiendas ni puede verificar su envío o recepción; para eso se necesita un backend o servicio de mensajería.<\/div>\n        <\/div>\n\n        <div class=\"card\">\n          <div style=\"font-size:13px;font-weight:700;margin-bottom:12px\">✉️ Nueva notificación<\/div>\n          <div class=\"grid grid-2\">\n            <div>\n              <label>Destino<\/label>\n              <select id=\"notifTarget\" onchange=\"toggleNotifTenant()\">\n                <option value=\"general\">🌍 General (todos los usuarios)<\/option>\n                <option value=\"privada\">🔒 Privada (usuario específico)<\/option>\n              <\/select>\n            <\/div>\n            <div id=\"notifTenantWrap\" style=\"display:none\">\n              <label>Tienda / Usuario<\/label>\n              <select id=\"notifTenant\"><\/select>\n            <\/div>\n          <\/div>\n          <label class=\"mt\">Tipo<\/label>\n          <select id=\"notifTipo\" class=\"mb\">\n            <option value=\"info\">ℹ️ Información<\/option>\n            <option value=\"aviso\">📢 Aviso<\/option>\n            <option value=\"urgente\">⚠️ Urgente<\/option>\n            <option value=\"exito\">✅ Éxito<\/option>\n            <option value=\"vencimiento\">⏰ Vencimiento<\/option>\n            <option value=\"renovacion\">🔄 Renovación<\/option>\n            <option value=\"mantenimiento\">🛠 Mantenimiento<\/option>\n            <option value=\"novedad\">🆕 Novedades<\/option>\n          <\/select>\n          <label>Título<\/label>\n          <input id=\"notifTitulo\" class=\"mb\" placeholder=\"Ej: Mantenimiento programado\">\n          <label>Mensaje<\/label>\n          <textarea id=\"notifMensaje\" class=\"mb\" rows=\"4\" placeholder=\"Escribe el contenido de la notificación...\"><\/textarea>\n          <div class=\"flex mt\">\n            <button class=\"btn btn-green\" onclick=\"enviarNotificacion()\">💾 Guardar notificación<\/button>\n            <button class=\"btn btn-gray\" onclick=\"notifPlantilla()\">📝 Plantilla según tipo<\/button>\n          <\/div>\n        <\/div>\n\n        <div id=\"notifContent\"><\/div>\n      <\/div>\n\n    <\/div><\!-- /page-content -->\n  <\/div><\!-- /main-content -->\n<\/div><\!-- /app-layout -->\n\n<\!-- ===== MODAL NUEVA / EDITAR ===== -->\n<div class=\"modal\" id=\"modal\">\n  <div class=\"modal-c\">\n    <h2 id=\"modalTitle\">Nueva licencia<\/h2>\n    <input type=\"hidden\" id=\"mId\">\n    <label>Nombre completo del dueño<\/label>\n    <input id=\"mName\" class=\"mb\" placeholder=\"Ej: Juan Pérez\">\n    <label>Usuario / Email<\/label>\n    <input id=\"mIdent\" class=\"mb\" placeholder=\"Ej: juan@tienda.com\">\n\n    <div id=\"mAccountSection\">\n      <div style=\"background:#1e2d1e;border:1px solid #22c55e44;border-radius:8px;padding:12px;margin-bottom:12px\">\n        <p style=\"font-size:12px;color:#22c55e;font-weight:700;margin-bottom:8px\">🔐 Credenciales de acceso a MedStore<\/p>\n        <p style=\"font-size:11px;color:#9aa3b7;margin-bottom:10px\">Se entrega al dueño y luego no se puede consultar desde el panel.<\/p>\n        <label>Nombre de la tienda<\/label>\n        <input id=\"mStoreName\" class=\"mb\" placeholder=\"Ej: Boutique Luna\">\n        <div id=\"mPwdWrap\"><label>Contraseña de acceso<\/label>\n        <div class=\"flex\" style=\"align-items:center;gap:6px\">\n          <input id=\"mPwd\" type=\"password\" autocomplete=\"new-password\" placeholder=\"Mínimo 8 caracteres\" style=\"flex:1\">\n          <button class=\"btn btn-sm btn-gray\" onclick=\"genPwd()\" type=\"button\">🎲 Auto<\/button>\n        <\/div>\n        <p id=\"mPwdHint\" style=\"font-size:11px;color:#9aa3b7;margin-top:4px\"><\/p><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"grid grid-2\">\n      <div>\n        <label>Plan<\/label>\n        <select id=\"mPlan\">\n          <option>Trial 30 días<\/option><option>Mensual<\/option><option>Trimestral<\/option>\n          <option>Semestral<\/option><option>Anual<\/option><option>Personalizado<\/option>\n        <\/select>\n      <\/div>\n      <div>\n        <div id=\"mDiasWrap\"><label>Días de licencia<\/label><input id=\"mDias\" type=\"number\" min=\"1\" value=\"30\"><\/div>\n      <\/div>\n    <\/div>\n    <div id=\"mEstadoWrap\"><label class=\"mt\">Estado inicial<\/label><select id=\"mEstado\" class=\"mb\"><option>ACTIVO<\/option><option>SUSPENDIDA<\/option><\/select><\/div>\n    <p id=\"mEditNote\" class=\"warn\" style=\"display:none\"><\/p>\n    <div class=\"flex mt\">\n      <button class=\"btn btn-gray\" onclick=\"closeModal()\">Cancelar<\/button>\n      <button class=\"btn btn-green\" onclick=\"guardar()\">💾 Guardar y crear cuenta<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- ===== MODAL GENÉRICO ===== -->\n<div class=\"modal\" id=\"gModal\">\n  <div class=\"modal-c\" id=\"gBox\">\n    <h2 id=\"gTitle\"><\/h2>\n    <div id=\"gBody\"><\/div>\n    <div class=\"flex mt\" id=\"gFoot\" style=\"flex-wrap:wrap;justify-content:flex-end\"><\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ===== DB ===== */\nconst DB={get:k=>{try{return JSON.parse(localStorage.getItem('ms52_'+k));}catch(e){return null;}},set:(k,v)=>localStorage.setItem('ms52_'+k,JSON.stringify(v))};\nconst LS=localStorage,$=id=>document.getElementById(id);\nconst PWD_KEY='ms52_admin_master_pwd';   /* hash PBKDF2 (formato pbkdf2$iter$sal$hash). Legacy: SHA-256 sin sal, se migra al iniciar sesión */\nconst META_KEY='ms52_admin_meta';        /* { createdAt, lastAccess, recoveryEmail, recoveryKeyHash, recoveryKeyAt } */\nconst HISTORY_KEY='ms52_security_log', LOCK_KEY='ms52_login_lock', SESS_KEY='ms52_admin_session2', IMPLOG_KEY='ms52_import_log';\nconst SESSION_IDLE=30*60000, SESSION_MAX=8*3600000, PWD_MIN=8;\nconst PLAN_DIAS={'Trial 30 días':30,'Mensual':30,'Trimestral':90,'Semestral':180,'Anual':365,'Personalizado':30};\n\n/* ===== UTIL ===== */\nfunction toast(m,t){const d=document.createElement('div');d.className='toast '+(t==='green'?'g':t==='red'?'r':t==='yellow'?'y':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500);}\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'2-digit'});}\nfunction fmtDateTime(d){if(!d)return'—';return new Date(d).toLocaleString('es-CO',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});}\nfunction addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString();}\nfunction diasRestantes(lic){return Math.ceil((new Date(lic.fecha_vencimiento)-new Date())/86400000);}\nfunction getLics(){return DB.get('licencias')||[];}\nfunction setLics(l){try{DB.set('licencias',l);}catch(e){toast('Error al guardar (¿almacenamiento lleno?): '+e.message,'red');throw e;}}\nfunction getTenants(){try{return JSON.parse(LS.getItem('ms_global_tenants')||'[]');}catch(e){return[];}}\nfunction setTenants(t){LS.setItem('ms_global_tenants',JSON.stringify(t));}\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);\nfunction randPwd(n){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(n||12));return[...r].map(b=>c[b%32]).join('');}\nasync function shaHex(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}\nfunction downloadJSON(obj,name){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}\n\n/* ===== MODAL GENÉRICO ===== (el handler devuelve true para cerrar; false/undefined mantiene abierto) */\nfunction openG(title,body,btns,wide){\n  $('gTitle').textContent=title;$('gBody').innerHTML=body;$('gBox').style.maxWidth=wide?'760px':'520px';\n  const f=$('gFoot');f.innerHTML='';\n  (btns||[{t:'Cerrar',c:'btn-gray'}]).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.c||'');e.textContent=b.t;\n    e.onclick=async()=>{if(!b.f){closeG();return;}const r=await b.f();if(r===true)closeG();};f.appendChild(e);});\n  $('gModal').classList.add('show');\n}\nfunction closeG(){$('gModal').classList.remove('show');}\n\n/* ===== CRIPTO / SEGURIDAD ===== */\nconst b64=u=>btoa(String.fromCharCode(...u)), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));\nasync function pbk(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256));}\nasync function hashPwd(pw){const s=crypto.getRandomValues(new Uint8Array(16)),it=210000;return'pbkdf2$'+it+'$'+b64(s)+'$'+b64(await pbk(pw,s,it));}\nfunction ctEq(a,b){if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0;}\nasync function verifyPwd(pw,st){if(!st||!st.startsWith('pbkdf2$'))return false;const[,it,s,h]=st.split('$');return ctEq(b64(await pbk(pw,unb64(s),+it)),h);}\nasync function checkAdminPwd(p){\n  const st=LS.getItem(PWD_KEY);if(!st)return false;\n  if(st.startsWith('pbkdf2$'))return verifyPwd(p,st);\n  /* Hash legacy (SHA-256 de la contraseña en minúsculas y sin espacios). Se valida una vez y se migra a PBKDF2 con la contraseña EXACTA escrita. */\n  if(await shaHex(p.toLowerCase().trim())===st){LS.setItem(PWD_KEY,await hashPwd(p));addSecurityEvent('🔐','Hash de contraseña migrado a PBKDF2 con sal','green');return true;}\n  return false;\n}\nconst pwdErr=p=>p.length<PWD_MIN?'Mínimo '+PWD_MIN+' caracteres':/^\\s+$/.test(p)?'No puede ser solo espacios':null;\nconst normKey=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');\nfunction genRecoveryKey(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(20));let s='';r.forEach((b,i)=>{s+=c[b%32];if(i%5===4&&i<19)s+='-';});return s;}\nasync function setRecoveryKey(){const k=genRecoveryKey(),m=getAdminMeta()||{};m.recoveryKeyHash=await hashPwd(normKey(k));m.recoveryKeyAt=new Date().toISOString();saveAdminMeta(m);return k;}\nfunction showKeyOnce(k,extra){\n  openG('🔑 Clave de recuperación',`<p class=\"muted mb\">${extra||''}Guárdala fuera de este navegador (papel o gestor de contraseñas). <b>Se muestra una sola vez<\/b>, no se puede consultar después y es de un solo uso: al usarla se genera una nueva.<\/p><div style=\"background:#0b0f1a;border:1px solid var(--yellow);border-radius:8px;padding:14px;text-align:center;font-family:monospace;font-size:16px;color:var(--yellow);letter-spacing:1px;user-select:all\">${esc(k)}<\/div>`,\n   [{t:'📋 Copiar',c:'btn-gray',f:()=>{navigator.clipboard&&navigator.clipboard.writeText(k).then(()=>toast('Copiada','green'));return false;}},{t:'Ya la guardé',c:'btn-green',f:()=>true}]);\n}\nfunction getAdminMeta(){try{return JSON.parse(LS.getItem(META_KEY)||'null');}catch(e){return null;}}\nfunction saveAdminMeta(meta){LS.setItem(META_KEY,JSON.stringify(meta));}\nfunction getSecurityLog(){try{return JSON.parse(LS.getItem(HISTORY_KEY)||'[]');}catch(e){return[];}}\nfunction addSecurityEvent(icon,text,color){const log=getSecurityLog();log.unshift({icon,text,color,date:new Date().toISOString()});if(log.length>100)log.length=100;LS.setItem(HISTORY_KEY,JSON.stringify(log));}\n\n/* Límite de intentos con espera progresiva (3 fallos → 15 s, 30 s, 60 s … máx. 30 min). NOTA: vive en localStorage; un atacante con acceso al navegador puede borrarlo. */\nfunction lockState(){try{return JSON.parse(LS.getItem(LOCK_KEY))||{n:0,until:0};}catch(e){return{n:0,until:0};}}\nfunction lockLeft(){return Math.max(0,lockState().until-Date.now());}\nfunction regFail(){const s=lockState();s.n++;if(s.n>=3)s.until=Date.now()+Math.min(30*60000,15000*Math.pow(2,s.n-3));LS.setItem(LOCK_KEY,JSON.stringify(s));addSecurityEvent('⛔','Intento de autenticación fallido #'+s.n,'red');}\nfunction regOk(){LS.removeItem(LOCK_KEY);}\nfunction lockToast(){const l=lockLeft();if(l)toast('Demasiados intentos. Espera '+Math.ceil(l/1000)+' s','yellow');return l>0;}\n\n/* Sesión: sessionStorage con inactividad máx. 30 min y duración máx. 8 h */\nfunction getSess(){try{return JSON.parse(sessionStorage.getItem(SESS_KEY));}catch(e){return null;}}\nfunction sessOk(){const s=getSess();if(!s)return false;const n=Date.now();if(n-s.last>SESSION_IDLE||n-s.t>SESSION_MAX){sessionStorage.removeItem(SESS_KEY);return false;}return true;}\nfunction touchSess(){const s=getSess();if(s&&sessOk()){s.last=Date.now();sessionStorage.setItem(SESS_KEY,JSON.stringify(s));}}\nfunction startSess(){sessionStorage.setItem(SESS_KEY,JSON.stringify({t:Date.now(),last:Date.now()}));sessionStorage.removeItem('ms52_admin_session');}\nlet _watching=false;\nfunction watchSess(){if(_watching)return;_watching=true;let lt=0;\n  ['click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{const n=Date.now();if(n-lt>15000){lt=n;touchSess();}},true));\n  setInterval(()=>{if(!sessOk()){toast('Sesión cerrada por inactividad','yellow');setTimeout(()=>location.reload(),900);}},20000);}\n\n/* ===== LOGIN FLOW ===== */\nfunction checkPwdSetup(){const has=!!LS.getItem(PWD_KEY);$('setupBox').style.display=has?'none':'block';$('loginBox').style.display=has?'block':'none';}\nasync function setupPwd(){\n  if(LS.getItem(PWD_KEY))return toast('Ya existe una cuenta','red');\n  const a=$('newPwd1').value,b=$('newPwd2').value,email=$('newRecoveryEmail').value.trim();\n  const e=pwdErr(a);if(e)return toast(e,'red');\n  if(a!==b)return toast('Las contraseñas no coinciden','red');\n  LS.setItem(PWD_KEY,await hashPwd(a));\n  saveAdminMeta({createdAt:new Date().toISOString(),lastAccess:null,recoveryEmail:email});\n  const k=await setRecoveryKey();\n  addSecurityEvent('🚀','Cuenta Super Admin creada','green');\n  $('newPwd1').value=$('newPwd2').value='';\n  checkPwdSetup();showKeyOnce(k,'Cuenta creada. ');\n}\nasync function doLogin(){\n  if(lockToast())return;\n  const p=$('loginPwd').value;\n  if(!LS.getItem(PWD_KEY))return toast('Configura una contraseña primero','red');\n  await sleep(500);\n  if(!(await checkAdminPwd(p))){regFail();if(!lockToast())toast('Contraseña incorrecta','red');return;}\n  regOk();$('loginPwd').value='';\n  const meta=getAdminMeta()||{};meta.lastAccess=new Date().toISOString();saveAdminMeta(meta);\n  startSess();enterApp();\n}\nfunction logout(){addSecurityEvent('🚪','Sesión cerrada','blue');sessionStorage.removeItem(SESS_KEY);sessionStorage.removeItem('ms52_admin_session');location.reload();}\nfunction showRecoveryFlow(){const m=getAdminMeta();if(!m||!m.recoveryKeyHash)return toast('No hay clave de recuperación configurada. Sin ella no es posible recuperar el acceso desde esta pantalla.','red');$('loginBox').style.display='none';$('recoveryBox').style.display='block';}\nfunction showLoginBox(){$('recoveryBox').style.display='none';$('loginBox').style.display='block';}\nasync function recoverCore(key,p1,p2){\n  if(lockToast())return null;\n  const e=pwdErr(p1);if(e){toast(e,'red');return null;}\n  if(p1!==p2){toast('Las contraseñas no coinciden','red');return null;}\n  const m=getAdminMeta()||{};await sleep(500);\n  if(!m.recoveryKeyHash||!(await verifyPwd(normKey(key),m.recoveryKeyHash))){regFail();if(!lockToast())toast('Clave de recuperación incorrecta','red');return null;}\n  regOk();LS.setItem(PWD_KEY,await hashPwd(p1));\n  const nk=await setRecoveryKey();\n  addSecurityEvent('🔄','Contraseña restablecida con clave de recuperación (clave consumida y regenerada)','yellow');\n  return nk;\n}\nasync function doRecover(){const nk=await recoverCore($('recoveryKey').value,$('recPwd1').value,$('recPwd2').value);if(!nk)return;['recoveryKey','recPwd1','recPwd2'].forEach(i=>$(i).value='');showLoginBox();showKeyOnce(nk,'Contraseña restablecida. ');}\n\n/* ===== APP ===== */\nfunction enterApp(){\n  $('loginScreen').style.display='none';$('app').style.display='flex';\n  const stored=LS.getItem('ms52_grace_days');\n  if($('graceDaysInput')){$('graceDaysInput').value=stored||'7';if(stored)$('graceDaysInfo').textContent='Configurado: '+stored+' días de gracia';}\n  watchSess();renderAll();loadConfigSection();\n  const m=getAdminMeta()||{};\n  if(!m.recoveryKeyHash)toast('Genera tu clave de recuperación en ⚙️ Configuración SA','yellow');\n}\nfunction goSection(s){\n  ['dash','lic','tools','config','ia_library','ia_training','notificaciones','arq'].forEach(x=>{const el=$('sec-'+x);if(el)el.style.display=x===s?'block':'none';});\n  document.querySelectorAll('.nav-item[data-section]').forEach(el=>el.classList.toggle('active',el.dataset.section===s));\n  const titles={'dash':'Dashboard','lic':'Licencias','tools':'Herramientas','config':'⚙️ Configuración SA','ia_library':'🧠 Biblioteca IA','ia_training':'🎓 Entrenamiento IA','notificaciones':'🔔 Notificaciones','arq':'🏗 Arquitectura SaaS'};\n  $('topbarTitle').textContent=titles[s]||s;\n  if(s==='dash')renderDash();if(s==='lic')renderTable();if(s==='config')loadConfigSection();if(s==='ia_library')renderLibGrid();if(s==='ia_training')renderTraining();if(s==='notificaciones')renderNotificaciones();\n  $('sidebar').classList.remove('open');\n}\nfunction toggleSidebar(){$('sidebar').classList.toggle('open');}\n\n/* ===== CONFIG SECTION ===== */\nfunction loadConfigSection(){\n  const meta=getAdminMeta();if(!meta)return;\n  $('infoCreatedAt').textContent=fmtDateTime(meta.createdAt);\n  $('infoLastAccess').textContent=fmtDateTime(meta.lastAccess);\n  $('infoRecoveryEmail').textContent=meta.recoveryEmail||'—';\n  $('infoTenants').textContent=getTenants().length;\n  $('cfgRecoveryEmail').value=meta.recoveryEmail||'';\n  $('infoRecoveryKey').textContent=meta.recoveryKeyHash?'Configurada · '+fmtDate(meta.recoveryKeyAt):'⚠️ No configurada';\n  renderSecurityHistory();\n}\nasync function cambiarPwd(){\n  const o=$('cpOld').value,n=$('cpNew').value,n2=$('cpNew2').value,fb=$('pwdFeedback');\n  const show=(m,ok)=>{fb.style.display='block';fb.style.color=ok?'var(--green)':'var(--red)';fb.textContent=m;};\n  if(lockToast())return;\n  if(!o)return show('❌ Escribe tu contraseña actual');\n  await sleep(500);\n  if(!(await checkAdminPwd(o))){regFail();return show('❌ Contraseña actual incorrecta');}\n  regOk();\n  const e=pwdErr(n);if(e)return show('❌ Nueva contraseña: '+e);\n  if(n!==n2)return show('❌ La nueva contraseña y su confirmación no coinciden');\n  if(n===o)return show('❌ La nueva contraseña debe ser distinta de la actual');\n  LS.setItem(PWD_KEY,await hashPwd(n));\n  $('cpOld').value=$('cpNew').value=$('cpNew2').value='';\n  show('✅ Contraseña actualizada',true);addSecurityEvent('🔐','Contraseña maestra cambiada desde Configuración','green');renderSecurityHistory();toast('Contraseña actualizada','green');\n}\nfunction saveRecoveryConfig(){\n  const email=$('cfgRecoveryEmail').value.trim();const m=getAdminMeta()||{};m.recoveryEmail=email;saveAdminMeta(m);\n  $('infoRecoveryEmail').textContent=email||'—';addSecurityEvent('📧','Correo de contacto actualizado (informativo)','blue');renderSecurityHistory();toast('Guardado','green');\n}\nfunction regenRecoveryKey(){\n  openG('🔑 Generar nueva clave de recuperación','<p class=\"muted mb\">Invalida la clave anterior. Confirma con tu contraseña actual.<\/p><label>Contraseña actual<\/label><input id=\"rkPwd\" type=\"password\" autocomplete=\"current-password\">',\n   [{t:'Cancelar',c:'btn-gray'},{t:'Generar',c:'btn-green',f:async()=>{if(lockToast())return false;await sleep(500);if(!(await checkAdminPwd($('rkPwd').value))){regFail();toast('Contraseña incorrecta','red');return false;}regOk();const k=await setRecoveryKey();addSecurityEvent('🎲','Clave de recuperación regenerada','yellow');loadConfigSection();showKeyOnce(k);return false;}}]);\n}\nfunction showResetFromConfig(){\n  openG('🔄 Restablecer contraseña maestra','<p class=\"muted mb\">Usa tu clave de recuperación de un solo uso. Si recuerdas tu contraseña actual, usa «Guardar cambios».<\/p><label>Clave de recuperación<\/label><input id=\"rmKey\" class=\"mb\" autocomplete=\"off\"><label>Nueva contraseña<\/label><input id=\"rmP1\" type=\"password\" class=\"mb\" autocomplete=\"new-password\"><label>Confirmar<\/label><input id=\"rmP2\" type=\"password\" autocomplete=\"new-password\">',\n   [{t:'Cancelar',c:'btn-gray'},{t:'Restablecer',c:'btn-red',f:async()=>{const nk=await recoverCore($('rmKey').value,$('rmP1').value,$('rmP2').value);if(!nk)return false;loadConfigSection();showKeyOnce(nk,'Contraseña restablecida. ');return false;}}]);\n}\nfunction clearSecurityLog(){if(!confirm('¿Borrar el historial de seguridad?'))return;LS.removeItem(HISTORY_KEY);addSecurityEvent('🗑','Historial de seguridad limpiado','yellow');renderSecurityHistory();toast('Historial limpiado','green');}\nfunction renderSecurityHistory(){\n  const log=getSecurityLog(),el=$('securityHistory');\n  if(!log.length){el.innerHTML='<div style=\"text-align:center;padding:20px;color:var(--text3);font-size:13px\">Sin registros aún<\/div>';return;}\n  const cm={green:'#22c55e22',blue:'#3b82f622',yellow:'#f59e0b22',red:'#ef444422'};\n  el.innerHTML=log.map(i=>`<div class=\"history-item\" style=\"padding:8px 16px\"><div class=\"hi-icon\" style=\"background:${cm[i.color]||'#26314a'}\">${esc(i.icon||'📋')}<\/div><div class=\"hi-text\">${esc(i.text)}<\/div><div class=\"hi-date\">${fmtDateTime(i.date)}<\/div><\/div>`).join('');\n}\n\n/* ===== LICENCIAS: MODELO ===== */\n/* Estado efectivo: SUSPENDIDA/CANCELADA/VENCIDA(manual) se respetan; ACTIVO pasa a VENCIDA si la fecha ya pasó. */\nfunction effEstado(l){const e=l.estado;if(e==='SUSPENDIDA'||e==='CANCELADA'||e==='VENCIDA')return e;return new Date(l.fecha_vencimiento)<new Date()?'VENCIDA':'ACTIVO';}\nfunction addHist(l,tipo,detalle,motivo){(l.historial=l.historial||[]).push({fecha:new Date().toISOString(),tipo,detalle:detalle||'',motivo:motivo||''});if(l.historial.length>300)l.historial.shift();}\nfunction tenantKeys(tid){if(!tid)return[];const p='ms_'+tid+'_',o=[];for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.startsWith(p))o.push(k);}return o;}\nfunction syncTenantStatus(l){if(!l.tenantId)return;const ts=getTenants(),t=ts.find(x=>x.id===l.tenantId);if(!t)return;t.status=(l.eliminada||l.estado==='SUSPENDIDA'||l.estado==='CANCELADA')?'suspended':'active';t.plan=l.plan;setTenants(ts);}\nfunction mutate(id,fn){const list=getLics(),l=list.find(x=>x.id===id);if(!l)return false;fn(l);setLics(list);syncTenantStatus(l);renderAll();return true;}\n/* IDs de tienda: contador que nunca retrocede + comprobación de claves existentes (evita reutilizar IDs de tiendas eliminadas). */\nfunction genTenantId(){\n  const nums=[...getTenants().map(t=>t.id),...getLics().map(l=>l.tenantId)].map(x=>+((/^TIENDA(\\d+)$/.exec(x||'')||[])[1])||0);\n  let n=Math.max(+LS.getItem('ms52_tenant_seq')||0,...nums,0)+1;\n  while(tenantKeys('TIENDA'+String(n).padStart(3,'0')).length)n++;\n  LS.setItem('ms52_tenant_seq',n);return'TIENDA'+String(n).padStart(3,'0');\n}\n\n/* ===== DASHBOARD ===== */\nlet page=0;const PER=15;\nfunction bars(items,color){const mx=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div style=\"display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0\"><span style=\"width:110px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${esc(i.l)}<\/span><div style=\"flex:1;background:var(--bg2);border-radius:4px;height:14px\"><div style=\"width:${i.v/mx*100}%;background:${color};height:14px;border-radius:4px;min-width:${i.v?2:0}px\"><\/div><\/div><b style=\"width:28px;text-align:right\">${i.v}<\/b><\/div>`).join('');}\nfunction renderDash(){\n  const all=getLics(),list=all.filter(l=>!l.eliminada),E=effEstado,D30=Date.now()-30*86400000;\n  $('kTotal').textContent=list.length;\n  $('kAct').textContent=list.filter(l=>E(l)==='ACTIVO').length;\n  $('kVen').textContent=list.filter(l=>E(l)==='VENCIDA').length;\n  $('kSus').textContent=list.filter(l=>E(l)==='SUSPENDIDA').length;\n  const por=list.filter(l=>E(l)==='ACTIVO'&&diasRestantes(l)>=0&&diasRestantes(l)<=7);\n  const ven=list.filter(l=>E(l)==='VENCIDA').sort((a,b)=>new Date(b.fecha_vencimiento)-new Date(a.fecha_vencimiento)).slice(0,8);\n  $('vencerList').innerHTML=por.length?por.map(l=>`<div style=\"padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between\"><span>${esc(l.cliente)}<\/span><span style=\"color:var(--yellow)\">${diasRestantes(l)}d<\/span><\/div>`).join(''):'<p class=\"muted\" style=\"font-size:13px\">Ninguna próxima a vencer ✅<\/p>';\n  $('vencidasList').innerHTML=ven.length?ven.map(l=>`<div style=\"padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between\"><span>${esc(l.cliente)}<\/span><span style=\"color:var(--red)\">${fmtDate(l.fecha_vencimiento)}<\/span><\/div>`).join(''):'<p class=\"muted\" style=\"font-size:13px\">Sin vencidas recientes ✅<\/p>';\n  /* Indicadores adicionales: todo calculado de los datos reales */\n  const rens=list.flatMap(l=>(l.renovaciones||[]));\n  const k=(l,v,c)=>`<div class=\"kpi\"><div class=\"l\">${l}<\/div><div class=\"v\" ${c?`style=\"color:${c}\"`:''}>${v}<\/div><\/div>`;\n  const plans={};list.forEach(l=>{const p=l.plan||'Sin plan';plans[p]=(plans[p]||0)+1;});\n  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('es-CO',{month:'short',year:'2-digit'}),v:0});}\n  rens.forEach(r=>{const d=new Date(r.fecha),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),m=months.find(x=>x.key===key);if(m)m.v++;});\n  $('dashExtra').innerHTML=`<div class=\"grid grid-4 mb\" style=\"margin-top:14px\">\n    ${k('Vencen en 30 días',list.filter(l=>E(l)==='ACTIVO'&&diasRestantes(l)>=0&&diasRestantes(l)<=30).length,'var(--yellow)')}\n    ${k('Nuevos (30 días)',list.filter(l=>l.creada&&new Date(l.creada)>=D30).length)}\n    ${k('Renovaciones (30 días)',rens.filter(r=>new Date(r.fecha)>=D30).length,'var(--green)')}\n    ${k('Canceladas',list.filter(l=>E(l)==='CANCELADA').length,'var(--text2)')}<\/div>\n    <div class=\"grid grid-2\"><div class=\"card\"><h3 style=\"margin-bottom:10px\">📦 Clientes por plan<\/h3>${list.length?bars(Object.entries(plans).map(([l,v])=>({l,v})),'var(--primary)'):'<p class=\"muted\">Sin datos<\/p>'}<\/div>\n    <div class=\"card\"><h3 style=\"margin-bottom:10px\">🔄 Renovaciones por mes<\/h3>${rens.length?bars(months,'var(--green)'):'<p class=\"muted\" style=\"font-size:12px\">Aún no hay renovaciones registradas. Se registran a partir de esta versión (las anteriores no guardaban historial).<\/p>'}<\/div><\/div>\n    ${all.some(l=>l.eliminada)?`<p class=\"muted\" style=\"font-size:12px\">🗑 ${all.filter(l=>l.eliminada).length} licencia(s) en la papelera (no cuentan en los totales).<\/p>`:''}`;\n}\nfunction renderAll(){renderDash();renderTable();}\nfunction setTab(t){goSection(t);}\n\n/* ===== TABLA DE LICENCIAS ===== */\nfunction renderTable(){\n  const trash=$('fPap').value==='1',all=getLics(),live=all.filter(l=>!l.eliminada);\n  const nW=live.filter(l=>effEstado(l)==='ACTIVO'&&diasRestantes(l)<=7).length,nV=live.filter(l=>effEstado(l)==='VENCIDA').length;\n  $('licAlert').innerHTML=(nW||nV)?`<div class=\"warn\" style=\"cursor:pointer\" onclick=\"$('fVence').value='alerta';renderTable()\">⏰ ${nW} licencia(s) por vencer (≤7 días) · ${nV} vencida(s) — clic para filtrar<\/div>`:'';\n  let list=all.filter(l=>!!l.eliminada===trash);\n  const q=($('search').value||'').toLowerCase(),est=$('fEstado').value,pl=$('fPlan').value,fv=$('fVence').value,srt=$('fSort').value;\n  if(q)list=list.filter(l=>[l.cliente,l.identifier,l.storeName,l.tenantId,l.plan,l.id].some(x=>String(x==null?'':x).toLowerCase().includes(q)));\n  if(est)list=list.filter(l=>effEstado(l)===est);\n  if(pl)list=list.filter(l=>l.plan===pl);\n  if(fv)list=list.filter(l=>{const d=diasRestantes(l),e=effEstado(l);return fv==='venc'?e==='VENCIDA':fv==='alerta'?(e==='VENCIDA'||(e==='ACTIVO'&&d<=7)):(e==='ACTIVO'&&d>=0&&d<=+fv);});\n  if(srt==='nombre')list.sort((a,b)=>(a.cliente||'').localeCompare(b.cliente||''));\n  else if(srt==='creada')list.sort((a,b)=>new Date(b.creada||0)-new Date(a.creada||0));\n  else list.sort((a,b)=>new Date(a.fecha_vencimiento||0)-new Date(b.fecha_vencimiento||0));\n  const total=list.length,pages=Math.max(1,Math.ceil(total/PER));if(page>=pages)page=pages-1;if(page<0)page=0;\n  const slice=list.slice(page*PER,(page+1)*PER);\n  $('pInfo').textContent=`${page+1}/${pages} · ${total} registros`+(trash?' (papelera)':'');\n  $('pPrev').disabled=page===0;$('pNext').disabled=page>=pages-1;\n  const col={'ACTIVO':'b-act','VENCIDA':'b-ven','SUSPENDIDA':'b-sus','CANCELADA':'b-can'};\n  const B=(f,id,c,ic,t)=>`<button class=\"btn btn-sm ${c}\" title=\"${t}\" onclick=\"${f}(${id})\">${ic}<\/button>`;\n  $('tbody').innerHTML=slice.map((l,i)=>{\n    const d=diasRestantes(l),e=effEstado(l),dc=d<0?'color:var(--red)':d<=7?'color:var(--yellow)':'color:var(--green)';\n    const acts=trash?B('restaurar',l.id,'btn-green','♻️','Restaurar')+B('openPurge',l.id,'btn-red','❌','Eliminar definitivamente')\n      :B('openFicha',l.id,'btn-gray','👁','Ficha del cliente')+B('openEdit',l.id,'btn-blue','✏️','Editar datos (no cambia el vencimiento)')+B('openRenew',l.id,'btn-green','🔄','Renovar')\n       +(e==='SUSPENDIDA'||e==='CANCELADA'?B('reactivar',l.id,'btn-green','▶️','Reactivar'):B('openSuspender',l.id,'btn-yellow','⏸','Suspender'))\n       +(e!=='CANCELADA'?B('openCancelar',l.id,'btn-gray','🚫','Cancelar licencia'):'')+B('openDelete',l.id,'btn-red','🗑','Mover a la papelera');\n    return`<tr>\n      <td style=\"color:var(--text3)\">${page*PER+i+1}<\/td>\n      <td style=\"font-weight:600\">${esc(l.cliente||'—')}<\/td>\n      <td style=\"font-family:monospace;font-size:12px\">${esc(l.identifier||'—')}<\/td>\n      <td>${esc(l.storeName||'—')}<div class=\"muted\" style=\"font-size:10px;font-family:monospace\">${esc(l.tenantId||'sin tenant')}<\/div><\/td>\n      <td><span class=\"badge b-aviso\">${esc(l.plan||'—')}<\/span><\/td>\n      <td><span class=\"badge ${col[e]||''}\">${e}<\/span><\/td>\n      <td style=\"color:var(--text2)\">${fmtDate(l.fecha_inicio)}<\/td>\n      <td style=\"color:var(--text2)\">${fmtDate(l.fecha_vencimiento)}<\/td>\n      <td style=\"${dc}\">${d>0?d+'d':d===0?'Hoy':Math.abs(d)+'d vencida'}<\/td>\n      <td class=\"row-actions\">${acts}<\/td><\/tr>`;\n  }).join('')||'<tr><td colspan=\"10\" class=\"muted\" style=\"text-align:center;padding:24px\">Sin resultados<\/td><\/tr>';\n}\nfunction changePage(d){page+=d;renderTable();}\n\n/* ===== MODAL NUEVA / EDITAR ===== */\nfunction openNew(){\n  ['mId','mName','mIdent','mStoreName','mPwd'].forEach(i=>$(i).value='');$('mPwd').type='password';\n  $('mPwdHint').textContent='Mínimo '+PWD_MIN+' caracteres. Se entrega al dueño y luego no podrá consultarse desde el panel.';\n  $('mPlan').value='Trial 30 días';$('mDias').value='30';$('mEstado').value='ACTIVO';\n  $('modalTitle').textContent='Nueva licencia';$('mPwdWrap').style.display=$('mDiasWrap').style.display=$('mEstadoWrap').style.display='block';$('mEditNote').style.display='none';\n  document.querySelector('#modal .btn-green').textContent='💾 Guardar y crear cuenta';$('modal').classList.add('show');\n}\nfunction openEdit(id){\n  const l=getLics().find(x=>x.id===id);if(!l)return;\n  $('mId').value=l.id;$('mName').value=l.cliente||'';$('mIdent').value=l.identifier||'';$('mStoreName').value=l.storeName||'';$('mPwd').value='';\n  $('mPlan').value=l.plan||'Mensual';\n  $('modalTitle').textContent='Editar datos de la licencia';$('mPwdWrap').style.display=$('mDiasWrap').style.display=$('mEstadoWrap').style.display='none';\n  $('mEditNote').style.display='block';$('mEditNote').textContent='Vence el '+fmtDate(l.fecha_vencimiento)+'. Editar NO cambia el vencimiento: usa 🔄 Renovar. Para cambiar la contraseña usa 👁 Ficha → Restablecer contraseña.';\n  document.querySelector('#modal .btn-green').textContent='💾 Guardar cambios';$('modal').classList.add('show');\n}\nfunction genPwd(){$('mPwd').type='text';$('mPwd').value=randPwd(12);$('mPwdHint').textContent='Contraseña generada: cópiala ahora; después no podrá consultarse.';}\nfunction closeModal(){$('modal').classList.remove('show');}\n\nfunction guardar(){\n  const id=$('mId').value,name=$('mName').value.trim(),ident=$('mIdent').value.trim().toLowerCase(),storeName=$('mStoreName').value.trim(),pwd=$('mPwd').value,plan=$('mPlan').value,dias=parseInt($('mDias').value),estado=$('mEstado').value;\n  if(!name)return toast('Nombre requerido','red');\n  if(!ident)return toast('Correo/usuario requerido','red');\n  const list=getLics(),tenants=getTenants();\n  const dup=list.find(x=>String(x.identifier).toLowerCase()===ident&&String(x.id)!==String(id));\n  if(dup)return toast('Ya existe una licencia con ese usuario/correo'+(dup.eliminada?' (en la papelera)':''),'red');\n  if(id){\n    const l=list.find(x=>x.id===+id);if(!l)return;\n    for(const t of tenants){if(t.id===l.tenantId)continue;try{if(JSON.parse(LS.getItem('ms_'+t.id+'_users_admin')||'[]').find(u=>u.identifier===ident))return toast('Ese correo ya lo usa otra tienda','red');}catch(e){}}\n    const ch=[],set=(k,v,lb)=>{if((l[k]||'')!==v){ch.push(lb+': «'+(l[k]||'—')+'» → «'+v+'»');l[k]=v;}};\n    set('cliente',name,'Cliente');set('identifier',ident,'Usuario');set('plan',plan,'Plan');set('storeName',storeName||l.storeName||'','Tienda');\n    if(!ch.length){closeModal();return toast('Sin cambios','yellow');}\n    addHist(l,'edicion',ch.join(' · '));   /* fecha_vencimiento NO se toca */\n    const t=tenants.find(t=>t.id===l.tenantId);\n    if(t){t.storeName=l.storeName;t.ownerName=name;t.email=ident;t.plan=plan;setTenants(tenants);}\n    if(l.tenantId){\n      const key='ms_'+l.tenantId+'_users_admin';\n      try{const admins=JSON.parse(LS.getItem(key)||'[]'),ua=admins.find(u=>u.id===l.userId);\n        if(ua){ua.name=name;ua.identifier=ident;if(l.storeName)ua.storeName=l.storeName;LS.setItem(key,JSON.stringify(admins));}\n        else toast('Licencia actualizada (usuario no encontrado en la tienda)','yellow');}catch(e){toast('No se pudo actualizar el usuario de la tienda','yellow');}\n    }\n    setLics(list);syncTenantStatus(l);toast('Datos actualizados · vencimiento intacto ('+fmtDate(l.fecha_vencimiento)+')','green');\n  }else{\n    const e=pwdErr(pwd);if(e)return toast('Contraseña: '+e,'red');\n    if(!(dias>0))return toast('Días de licencia inválidos','red');\n    for(const t of tenants){try{if(JSON.parse(LS.getItem('ms_'+t.id+'_users_admin')||'[]').find(u=>u.identifier===ident))return toast('Ya existe una cuenta con ese correo','red');}catch(e){}}\n    const userId=uid(),tenantId=genTenantId(),now=new Date().toISOString();\n    tenants.push({id:tenantId,storeName:storeName||name,ownerName:name,email:ident,status:estado==='SUSPENDIDA'?'suspended':'active',plan,createdAt:now});\n    setTenants(tenants);\n    /* ⚠ MedStore lee `pwd` de este registro para iniciar sesión (app principal no incluida en este archivo). El panel NUNCA lo vuelve a leer, mostrar ni exportar. Requiere migrar la app principal a hash/backend. */\n    LS.setItem('ms_'+tenantId+'_users_admin',JSON.stringify([{id:userId,name,identifier:ident,pwd,role:'admin',sucursalId:1,avatar:name.charAt(0).toUpperCase(),tenantId,storeName:storeName||name,createdByAdmin:true,createdAt:now}]));\n    LS.setItem('ms_'+tenantId+'_sucursales',JSON.stringify([{id:1,nombre:storeName||name,dir:'',ciudad:'',pais:'',tel:'',resp:name,lat:'',lng:''}]));\n    const l={id:userId,userId,tenantId,cliente:name,identifier:ident,storeName:storeName||name,plan,estado,fecha_inicio:now,fecha_vencimiento:addDays(now,dias),creada:now,renovaciones:[],observaciones:''};\n    addHist(l,'creacion','Licencia creada · '+plan+' · '+dias+' días · '+tenantId);\n    list.push(l);setLics(list);toast('✅ Tienda '+tenantId+' creada · Usuario: '+ident,'green');\n  }\n  closeModal();renderAll();\n}\n\n/* ===== RENOVAR / SUSPENDER / CANCELAR / REACTIVAR ===== */\nfunction openRenew(id){\n  const l=getLics().find(x=>x.id===id);if(!l)return;\n  openG('🔄 Renovar licencia',`<p class=\"muted mb\">${esc(l.cliente)} · vence actualmente <b>${fmtDate(l.fecha_vencimiento)}<\/b><\/p><label>Plan<\/label><select id=\"rnPlan\" class=\"mb\">${$('mPlan').innerHTML}<\/select><label>Días a sumar<\/label><input id=\"rnDias\" type=\"number\" min=\"1\" max=\"3650\" class=\"mb\"><p id=\"rnPrev\" class=\"muted\"><\/p>`,\n   [{t:'Cancelar',c:'btn-gray'},{t:'Confirmar renovación',c:'btn-green',f:()=>{\n     const dias=parseInt($('rnDias').value),plan=$('rnPlan').value;\n     if(!(dias>=1&&dias<=3650)){toast('Días entre 1 y 3650','red');return false;}\n     mutate(id,x=>{const now=new Date().toISOString(),desde=x.fecha_vencimiento,hasta=addDays(new Date(Math.max(Date.now(),new Date(desde))),dias);\n       (x.renovaciones=x.renovaciones||[]).push({fecha:now,dias,plan,desde,hasta});x.ultimaRenovacion=now;x.fecha_vencimiento=hasta;\n       if(plan!==x.plan){addHist(x,'edicion','Plan: «'+x.plan+'» → «'+plan+'»');x.plan=plan;}\n       if(x.estado==='VENCIDA')x.estado='ACTIVO';\n       addHist(x,'renovacion','+'+dias+' días · nuevo vencimiento '+fmtDate(hasta));});\n     toast('Licencia renovada','green');return true;}}]);\n  const upd=()=>{const d=parseInt($('rnDias').value)||0;$('rnPrev').textContent=d>0?'Nuevo vencimiento: '+fmtDate(addDays(new Date(Math.max(Date.now(),new Date(l.fecha_vencimiento))),d)):'';};\n  $('rnPlan').value=l.plan||'Mensual';$('rnDias').value=PLAN_DIAS[$('rnPlan').value]||30;\n  $('rnPlan').onchange=()=>{$('rnDias').value=PLAN_DIAS[$('rnPlan').value]||30;upd();};$('rnDias').oninput=upd;upd();\n}\nfunction openMotivo(id,tipo){\n  const l=getLics().find(x=>x.id===id);if(!l)return;const sus=tipo==='SUSPENDIDA';\n  openG(sus?'⏸ Suspender licencia':'🚫 Cancelar licencia',`<p class=\"mb\">${esc(l.cliente)} · ${esc(l.storeName||'')}<\/p><div class=\"warn\">${sus?'El acceso queda bloqueado temporalmente.':'La licencia se marca como cancelada y el acceso se bloquea.'} <b>No se borra ningún dato de la tienda<\/b> y puede reactivarse después.<\/div><label>Motivo (obligatorio)<\/label><textarea id=\"mvText\" rows=\"3\"><\/textarea>`,\n   [{t:'Volver',c:'btn-gray'},{t:sus?'Suspender':'Cancelar licencia',c:sus?'btn-yellow':'btn-red',f:()=>{const m=$('mvText').value.trim();if(m.length<3){toast('Indica el motivo','red');return false;}\n     mutate(id,x=>{x.estado=tipo;x[sus?'motivoSuspension':'motivoCancelacion']=m;addHist(x,sus?'suspension':'cancelacion','',m);});toast(sus?'Licencia suspendida':'Licencia cancelada','yellow');return true;}}]);\n}\nfunction openSuspender(id){openMotivo(id,'SUSPENDIDA');}\nfunction openCancelar(id){openMotivo(id,'CANCELADA');}\nfunction reactivar(id){\n  const l=getLics().find(x=>x.id===id);if(!l)return;\n  if(!confirm('¿Reactivar la licencia de '+l.cliente+'?\\nVence el '+fmtDate(l.fecha_vencimiento)+(new Date(l.fecha_vencimiento)<new Date()?' (ya está vencida: renuévala después).':'.')))return;\n  mutate(id,x=>{const p=x.estado;x.estado='ACTIVO';addHist(x,'reactivacion','Estado anterior: '+p);});toast('Licencia reactivada','green');\n}\n\n/* ===== ELIMINACIÓN LÓGICA / DEFINITIVA ===== */\nfunction dataSize(keys){let b=0;keys.forEach(k=>b+=k.length+(LS.getItem(k)||'').length);return b<1024?b+' B':(b/1024).toFixed(1)+' KB';}\nfunction openDelete(id){\n  const l=getLics().find(x=>x.id===id);if(!l)return;const ks=tenantKeys(l.tenantId);\n  openG('🗑 Mover a la papelera',`<p class=\"mb\"><b>${esc(l.cliente)}<\/b> · ${esc(l.storeName||'—')} · <code>${esc(l.tenantId||'sin tenant')}<\/code><\/p><div class=\"info-block\"><div class=\"info-row\"><span class=\"info-key\">Qué ocurre<\/span><span class=\"info-val\">La licencia se oculta y el acceso se bloquea<\/span><\/div><div class=\"info-row\"><span class=\"info-key\">Datos de la tienda<\/span><span class=\"info-val\">${ks.length} registros (${dataSize(ks)}) — NO se borran<\/span><\/div><div class=\"info-row\"><span class=\"info-key\">Recuperación<\/span><span class=\"info-val\">Posible desde la papelera<\/span><\/div><\/div><p class=\"muted\">El borrado definitivo es un paso aparte, solo desde la papelera.<\/p>`,\n   [{t:'Cancelar',c:'btn-gray'},{t:'Mover a la papelera',c:'btn-red',f:()=>{mutate(id,x=>{x.eliminada=true;x.eliminadaAt=new Date().toISOString();addHist(x,'eliminacion','Movida a la papelera (estado previo: '+x.estado+')');});toast('Licencia en la papelera','yellow');return true;}}]);\n}\nfunction eliminar(id){openDelete(id);}\nfunction restaurar(id){mutate(id,x=>{x.eliminada=false;delete x.eliminadaAt;addHist(x,'restauracion','Restaurada desde la papelera');});toast('Licencia restaurada','green');}\nfunction tenantBackup(tid){const td={};tenantKeys(tid).forEach(k=>td[k]=sanitizeVal(LS.getItem(k)));return{format:'medstore-tenant-backup',version:2,exportado:new Date().toISOString(),tenant:getTenants().find(t=>t.id===tid)||null,licencia:getLics().find(l=>l.tenantId===tid)||null,tenantData:td,note:'Contraseñas excluidas.'};}\nfunction openPurge(id){\n  const l=getLics().find(x=>x.id===id);if(!l||!l.eliminada)return;const ks=tenantKeys(l.tenantId),conf=l.tenantId||'ELIMINAR';\n  openG('❌ Eliminar definitivamente',`<div class=\"warn\" style=\"border-color:#ef444477;color:#fca5a5\"><b>Irreversible.<\/b> Se borrará la licencia de <b>${esc(l.cliente)}<\/b>, la tienda <code>${esc(l.tenantId||'—')}<\/code> y sus <b>${ks.length} registros de datos<\/b> (${dataSize(ks)}). Antes se descargará una copia de seguridad (sin contraseñas).<\/div><label>Escribe <b>${esc(conf)}<\/b> para confirmar<\/label><input id=\"pgConf\" autocomplete=\"off\">`,\n   [{t:'Cancelar',c:'btn-gray'},{t:'Eliminar definitivamente',c:'btn-red',f:()=>{\n     if($('pgConf').value.trim()!==conf){toast('La confirmación no coincide','red');return false;}\n     if(l.tenantId){downloadJSON(tenantBackup(l.tenantId),'backup-'+l.tenantId+'-'+new Date().toISOString().slice(0,10)+'.json');ks.forEach(k=>LS.removeItem(k));setTenants(getTenants().filter(t=>t.id!==l.tenantId));}\n     setLics(getLics().filter(x=>x.id!==id));addSecurityEvent('❌','Eliminación definitiva: '+(l.tenantId||l.cliente),'red');renderAll();toast('Eliminada definitivamente','red');return true;}}]);\n}\n\n/* ===== FICHA DEL CLIENTE ===== */\nfunction openFicha(id){\n  const l=getLics().find(x=>x.id===id);if(!l)return;\n  const t=getTenants().find(x=>x.id===l.tenantId),E=effEstado(l),nd='<span class=\"muted\">No disponible<\/span>';\n  const uk=l.tenantId?tenantKeys(l.tenantId).filter(k=>/_users_/.test(k)):[];let nu=null;\n  if(uk.length){nu=0;uk.forEach(k=>{try{const a=JSON.parse(LS.getItem(k));if(Array.isArray(a))nu+=a.length;}catch(e){}});}\n  const row=(k,v)=>`<div class=\"info-row\"><span class=\"info-key\">${k}<\/span><span class=\"info-val\" style=\"text-align:right;max-width:65%\">${v}<\/span><\/div>`;\n  const H=(l.historial||[]).slice().reverse(),sus=H.filter(h=>['suspension','reactivacion','cancelacion'].includes(h.tipo));\n  const hl=a=>a.length?a.slice(0,40).map(h=>`<div class=\"history-item\"><div class=\"hi-text\"><b>${esc(h.tipo)}<\/b> ${esc(h.detalle)}${h.motivo?'<br><i>Motivo: '+esc(h.motivo)+'<\/i>':''}<\/div><div class=\"hi-date\">${fmtDateTime(h.fecha)}<\/div><\/div>`).join(''):'<p class=\"muted\" style=\"font-size:12px\">Sin registros (no existen datos anteriores a esta versión).<\/p>';\n  const ren=(l.renovaciones||[]).slice().reverse();\n  const notifs=getNotificaciones().filter(n=>n.target==='privada'&&n.tenantId===l.tenantId);\n  openG('👁 Ficha del cliente',`<div class=\"info-block\">\n    ${row('Propietario',esc(l.cliente))}${row('Tienda',esc(l.storeName||'—'))}${row('ID de licencia',esc(l.id))}${row('ID de tienda (tenant)',l.tenantId?'<code>'+esc(l.tenantId)+'<\/code>'+(t?'':' <span style=\"color:var(--red)\">⚠ no existe en la lista de tiendas<\/span>'):'<span style=\"color:var(--yellow)\">Sin tenant vinculado<\/span>')}\n    ${row('Usuario / correo',esc(l.identifier||'—'))}${row('Contraseña','<span class=\"muted\">Protegida — no se puede consultar<\/span>')}\n    ${row('Plan',esc(l.plan||'—'))}${row('Estado','<span class=\"badge '+({ACTIVO:'b-act',VENCIDA:'b-ven',SUSPENDIDA:'b-sus',CANCELADA:'b-can'}[E])+'\">'+E+'<\/span>'+(l.eliminada?' · en papelera':''))}\n    ${row('Creada',fmtDateTime(l.creada))}${row('Inicio',fmtDate(l.fecha_inicio))}${row('Vencimiento',fmtDate(l.fecha_vencimiento)+' ('+diasRestantes(l)+' d)')}${row('Última renovación',l.ultimaRenovacion?fmtDateTime(l.ultimaRenovacion):'Sin renovaciones registradas')}\n    ${row('Usuarios/trabajadores',nu==null?nd:nu+' <span class=\"muted\">(registros locales)<\/span>')}${row('Último acceso',nd+' <span class=\"muted\">· requiere integración con backend<\/span>')}\n    ${l.motivoSuspension&&E==='SUSPENDIDA'?row('Motivo suspensión',esc(l.motivoSuspension)):''}${l.motivoCancelacion&&E==='CANCELADA'?row('Motivo cancelación',esc(l.motivoCancelacion)):''}<\/div>\n    <h3 class=\"mb\" style=\"font-size:13px\">🔄 Renovaciones (${ren.length})<\/h3>${ren.length?'<div class=\"history-block\" style=\"padding:6px 12px\">'+ren.map(r=>`<div class=\"history-item\"><div class=\"hi-text\">+${esc(r.dias)} d · ${esc(r.plan)} · hasta ${fmtDate(r.hasta)}<\/div><div class=\"hi-date\">${fmtDateTime(r.fecha)}<\/div><\/div>`).join('')+'<\/div>':'<p class=\"muted mb\" style=\"font-size:12px\">Sin renovaciones registradas.<\/p>'}\n    <h3 class=\"mb mt\" style=\"font-size:13px\">⏸ Suspensiones, reactivaciones y cancelaciones<\/h3><div class=\"history-block\" style=\"padding:6px 12px\">${hl(sus)}<\/div>\n    <h3 class=\"mb mt\" style=\"font-size:13px\">📋 Historial completo de cambios<\/h3><div class=\"history-block\" style=\"padding:6px 12px;max-height:200px;overflow:auto\">${hl(H)}<\/div>\n    <h3 class=\"mb mt\" style=\"font-size:13px\">🔔 Notificaciones privadas guardadas (${notifs.length})<\/h3><p class=\"muted\" style=\"font-size:12px\">${notifs.length?notifs.slice(0,5).map(n=>esc(n.titulo)+' · '+fmtDate(n.fecha)).join('<br>'):'Ninguna.'}<br>Estado de entrega: no verificable sin backend.<\/p>\n    <label class=\"mt\">Observaciones administrativas<\/label><textarea id=\"fObs\" rows=\"3\">${esc(l.observaciones||'')}<\/textarea>\n    <div class=\"flex mt\"><button class=\"btn btn-sm btn-green\" onclick=\"saveObs(${l.id})\">💾 Guardar observaciones<\/button><button class=\"btn btn-sm btn-yellow\" onclick=\"resetClientPwd(${l.id})\">🔑 Restablecer contraseña<\/button><\/div><div id=\"fPwdOut\"><\/div>`,\n   [{t:'✏️ Editar',c:'btn-blue',f:()=>{closeG();openEdit(id);return false;}},{t:'🔄 Renovar',c:'btn-green',f:()=>{closeG();openRenew(id);return false;}},{t:'Cerrar',c:'btn-gray'}],true);\n}\nfunction saveObs(id){const v=$('fObs').value;mutate(id,x=>{if((x.observaciones||'')!==v){x.observaciones=v;addHist(x,'observaciones','Observaciones actualizadas');}});toast('Observaciones guardadas','green');}\nfunction verClave(id){openFicha(id);}   /* ya no existe consulta de contraseñas */\nfunction resetClientPwd(id){\n  const l=getLics().find(x=>x.id===id);if(!l||!l.tenantId)return toast('Sin tenant vinculado','red');\n  if(!confirm('¿Generar una contraseña temporal nueva para '+l.cliente+'? La anterior dejará de funcionar y no se mostrará.'))return;\n  const key='ms_'+l.tenantId+'_users_admin';let admins;try{admins=JSON.parse(LS.getItem(key)||'[]');}catch(e){return toast('Datos de usuarios ilegibles','red');}\n  const u=admins.find(x=>x.id===l.userId)||admins.find(x=>x.identifier===l.identifier);if(!u)return toast('Usuario de la tienda no encontrado','red');\n  const p=randPwd(12);u.pwd=p;u.mustChangePwd=true;LS.setItem(key,JSON.stringify(admins));   /* ver nota en guardar(): la app principal aún lee `pwd` */\n  mutate(id,x=>addHist(x,'password','Contraseña restablecida por Super Admin (valor no registrado)'));\n  $('fPwdOut').innerHTML=`<div class=\"warn mt\">Contraseña temporal (se muestra <b>una sola vez<\/b>): <code style=\"user-select:all;font-size:14px;color:var(--yellow)\">${esc(p)}<\/code><\/div>`;\n}\n\n/* ===== COPIAS DE SEGURIDAD / IMPORTACIÓN ===== */\nfunction sanitizeVal(s){try{const v=JSON.parse(s);if(Array.isArray(v)){return JSON.stringify(v.map(o=>{if(o&&typeof o==='object'){const c={...o};['pwd','password','pass'].forEach(k=>delete c[k]);return c;}return o;}));}}catch(e){}return s;}\nfunction getImpLog(){try{return JSON.parse(LS.getItem(IMPLOG_KEY)||'[]');}catch(e){return[];}}\nfunction buildBackup(){const td={};getTenants().forEach(t=>tenantKeys(t.id).forEach(k=>td[k]=sanitizeVal(LS.getItem(k))));\n  return{format:'medstore-backup',version:2,exportado:new Date().toISOString(),licencias:getLics(),tenants:getTenants(),notificaciones:getNotificaciones(),grace:LS.getItem('ms52_grace_days'),tenantData:td,note:'Contraseñas excluidas. Biblioteca IA (IndexedDB) no incluida. Tras restaurar, restablece las contraseñas de tiendas que no existan ya en este navegador.'};}\nfunction exportar(){downloadJSON(buildBackup(),'medstore-backup-'+new Date().toISOString().slice(0,10)+'.json');addSecurityEvent('💾','Copia de seguridad descargada','blue');toast('Copia de seguridad descargada','green');}\nfunction validateLic(l){const e=[];if(!l||typeof l!=='object'||Array.isArray(l))return['no es un objeto'];\n  if(l.id==null||l.id===''||isNaN(+l.id))e.push('id inválido');if(!l.cliente||typeof l.cliente!=='string')e.push('cliente vacío');if(!l.identifier||typeof l.identifier!=='string')e.push('usuario vacío');\n  if(!l.fecha_vencimiento||isNaN(new Date(l.fecha_vencimiento)))e.push('fecha de vencimiento inválida');\n  if(l.estado&&!['ACTIVO','VENCIDA','SUSPENDIDA','CANCELADA'].includes(l.estado))e.push('estado desconocido «'+l.estado+'»');\n  if(l.tenantId&&!/^[A-Za-z0-9_-]+$/.test(String(l.tenantId)))e.push('tenantId inválido');return e;}\nfunction normalizeImport(d){if(d&&d.format==='medstore-tenant-backup')return{licencias:d.licencia?[d.licencia]:[],tenants:d.tenant?[d.tenant]:[],tenantData:d.tenantData};return d;}\nfunction analyzeImport(data,modo){\n  if(!data||typeof data!=='object'||!Array.isArray(data.licencias))return{fatal:'El archivo no contiene una lista «licencias» válida'};\n  const cur=modo==='merge'?getLics():[],rep={data,modo,ok:[],upd:[],skip:[]},sI=new Set(),sT=new Set(),sU=new Set();\n  data.licencias.forEach((l,i)=>{\n    const lab='#'+(i+1)+' '+((l&&l.cliente)||'sin nombre'),errs=validateLic(l);\n    if(!errs.length){const ident=String(l.identifier).toLowerCase(),sid=String(l.id);\n      if(sI.has(sid))errs.push('id repetido en el archivo');if(l.tenantId&&sT.has(l.tenantId))errs.push('tenantId repetido en el archivo');if(sU.has(ident))errs.push('usuario repetido en el archivo');\n      const c=cur.find(x=>String(x.id)===sid);\n      if(c&&(c.tenantId||'')!==(l.tenantId||''))errs.push('mismo id pero otra tienda (mezcla de datos)');\n      else if(l.tenantId&&cur.find(x=>x.tenantId===l.tenantId&&String(x.id)!==sid))errs.push('el tenant ya pertenece a otra licencia');\n      else if(cur.find(x=>String(x.identifier).toLowerCase()===ident&&String(x.id)!==sid))errs.push('el usuario ya existe en otra licencia');\n      if(!errs.length){sI.add(sid);if(l.tenantId)sT.add(l.tenantId);sU.add(ident);}}\n    if(errs.length)rep.skip.push({lab,errs});else if(cur.find(x=>String(x.id)===String(l.id)))rep.upd.push(l);else rep.ok.push(l);});\n  return rep;\n}\nfunction importar(modo){\n  const f=$('impFile').files[0];if(!f)return toast('Selecciona un archivo','red');\n  if(f.size>25e6)return toast('Archivo demasiado grande (máx. 25 MB)','red');\n  const r=new FileReader();r.onerror=()=>toast('No se pudo leer el archivo','red');\n  r.onload=e=>{let d;try{d=JSON.parse(e.target.result);}catch(err){return toast('JSON inválido: '+err.message,'red');}\n    const rep=analyzeImport(normalizeImport(d),modo);if(rep.fatal)return toast(rep.fatal,'red');rep.file=f.name;showImportPreview(rep);};\n  r.readAsText(f);\n}\nfunction showImportPreview(rep){\n  const rp=rep.modo==='reemplazar',n=rep.ok.length+rep.upd.length;\n  openG(rp?'⚠️ Reemplazar todas las licencias':'Importar y fusionar',`<div class=\"info-block\"><div class=\"info-row\"><span class=\"info-key\">Archivo<\/span><span class=\"info-val\">${esc(rep.file)}<\/span><\/div><div class=\"info-row\"><span class=\"info-key\">Nuevas<\/span><span class=\"info-val\" style=\"color:var(--green)\">${rep.ok.length}<\/span><\/div><div class=\"info-row\"><span class=\"info-key\">Actualizan existentes (mismo id y tienda)<\/span><span class=\"info-val\">${rep.upd.length}<\/span><\/div><div class=\"info-row\"><span class=\"info-key\">Rechazadas<\/span><span class=\"info-val\" style=\"color:${rep.skip.length?'var(--red)':'var(--green)'}\">${rep.skip.length}<\/span><\/div><\/div>\n   ${rep.skip.length?'<div class=\"history-block\" style=\"max-height:150px;overflow:auto;padding:6px 12px\">'+rep.skip.slice(0,50).map(s=>`<div class=\"history-item\"><div class=\"hi-text\"><b>${esc(s.lab)}<\/b>: ${esc(s.errs.join('; '))}<\/div><\/div>`).join('')+'<\/div>':''}\n   ${rp?'<div class=\"warn mt\" style=\"border-color:#ef444477;color:#fca5a5\">Se reemplazará la lista de licencias actual. Las tiendas y sus datos locales existentes no se borran.<\/div><label style=\"display:flex;gap:8px;align-items:center;color:var(--text)\"><input type=\"checkbox\" id=\"impBk\" checked style=\"width:auto\"> Descargar copia de seguridad actual antes de reemplazar<\/label>':''}`,\n   [{t:'Cancelar',c:'btn-gray'},...(n?[{t:rp?'Reemplazar':'Importar '+n,c:rp?'btn-red':'btn-green',f:()=>{\n     if(rp){if($('impBk')&&$('impBk').checked)exportar();if(!confirm('¿Confirmas reemplazar TODAS las licencias actuales por '+n+' del archivo?'))return false;}\n     const valid=[...rep.ok,...rep.upd].map(l=>{const c={...l};delete c.pwd;return c;});\n     if(rp)setLics(valid);else{const m=new Map(getLics().map(l=>[String(l.id),l]));valid.forEach(l=>m.set(String(l.id),l));setLics([...m.values()]);}\n     const d=rep.data,known=new Set(getTenants().map(t=>t.id));let nt=0;\n     if(Array.isArray(d.tenants)){const ts=getTenants();d.tenants.forEach(t=>{if(t&&t.id&&/^[A-Za-z0-9_-]+$/.test(t.id)&&!ts.find(x=>x.id===t.id)){ts.push(t);nt++;}});setTenants(ts);}\n     const nd=applyTenantData(d,rp?null:known);\n     const lg=getImpLog();lg.unshift({fecha:new Date().toISOString(),modo:rep.modo,archivo:rep.file,importadas:n,rechazadas:rep.skip,tiendasNuevas:nt,registrosDatos:nd});lg.length=Math.min(lg.length,10);LS.setItem(IMPLOG_KEY,JSON.stringify(lg));\n     addSecurityEvent('📥','Importación ('+rep.modo+'): '+n+' ok, '+rep.skip.length+' rechazadas','blue');\n     renderAll();toast('Importadas '+n+' · rechazadas '+rep.skip.length+(nd?' · '+nd+' registros de datos':''),rep.skip.length?'yellow':'green');return true;}}]:[])],true);\n}\n/* Restaura datos privados solo para tiendas declaradas en el archivo; en «merge» nunca sobrescribe tiendas que ya existen. Conserva contraseñas locales por id. */\nfunction applyTenantData(d,existing){\n  if(!d||!d.tenantData||typeof d.tenantData!=='object')return 0;let n=0;const ids=(d.tenants||[]).map(t=>t&&t.id).filter(Boolean);\n  Object.keys(d.tenantData).forEach(k=>{const tid=ids.find(i=>k.startsWith('ms_'+i+'_'));if(!tid||(existing&&existing.has(tid)))return;\n    let v=d.tenantData[k];if(typeof v!=='string')return;\n    if(/_users_/.test(k)){try{const cur=JSON.parse(LS.getItem(k)||'[]'),inc=JSON.parse(v);if(Array.isArray(inc)){inc.forEach(u=>{const c=Array.isArray(cur)&&cur.find(x=>x.id===u.id);if(c&&c.pwd)u.pwd=c.pwd;else u.needsPwdReset=true;});v=JSON.stringify(inc);}}catch(e){}}\n    LS.setItem(k,v);n++;});\n  return n;\n}\nfunction verLogImport(){\n  const lg=getImpLog();\n  openG('📋 Registro de importaciones',lg.length?lg.map(x=>`<div class=\"info-block\"><div class=\"info-row\"><span class=\"info-key\">${fmtDateTime(x.fecha)} · ${esc(x.modo)}<\/span><span class=\"info-val\">${esc(x.archivo)}<\/span><\/div><div class=\"info-row\"><span class=\"info-key\">Importadas / rechazadas<\/span><span class=\"info-val\">${x.importadas} / ${x.rechazadas.length}<\/span><\/div>${x.rechazadas.slice(0,20).map(s=>`<div class=\"muted\" style=\"font-size:11px\">• ${esc(s.lab)}: ${esc(s.errs.join('; '))}<\/div>`).join('')}<\/div>`).join(''):'<p class=\"muted\">Sin importaciones registradas.<\/p>',null,true);\n}\n/* Sincronización: vincula por tenantId (nunca por nombre), no duplica y reporta inconsistencias sin borrar nada. */\nfunction sincronizar(){\n  const ts=getTenants(),list=getLics(),now=new Date().toISOString();let created=0,linked=0;const mism=[],orph=[],dups=[];\n  ts.forEach(t=>{\n    let l=list.find(x=>x.tenantId===t.id)||list.find(x=>!x.tenantId&&(x.userId===t.id||(x.identifier&&t.email&&x.identifier===t.email)));\n    if(!l){l={id:uid(),userId:null,tenantId:t.id,cliente:t.ownerName||t.storeName||t.id,identifier:(t.email||'').toLowerCase(),storeName:t.storeName||'',plan:'Trial 30 días',estado:'ACTIVO',fecha_inicio:now,fecha_vencimiento:addDays(now,30),creada:now,renovaciones:[]};addHist(l,'creacion','Creada por sincronización · '+t.id);list.push(l);created++;}\n    else if(!l.tenantId){l.tenantId=t.id;addHist(l,'edicion','Vinculada por sincronización a '+t.id);linked++;}\n    if(l.identifier&&t.email&&String(l.identifier).toLowerCase()!==String(t.email).toLowerCase())mism.push(t.id+' (licencia: '+l.identifier+' · tienda: '+t.email+')');\n  });\n  list.forEach(l=>{if(!l.eliminada&&l.tenantId&&!ts.find(t=>t.id===l.tenantId))orph.push(l.cliente+' → '+l.tenantId);});\n  const c={};list.filter(l=>!l.eliminada).forEach(l=>{const k=String(l.identifier||'').toLowerCase();if(k)(c[k]=c[k]||[]).push(l);});Object.entries(c).forEach(([k,a])=>{if(a.length>1)dups.push(k+' ('+a.length+' licencias)');});\n  setLics(list);renderAll();\n  const sec=(t,a)=>a.length?`<h3 style=\"font-size:13px;margin:10px 0 4px\">${t}<\/h3>${a.map(x=>`<div class=\"muted\" style=\"font-size:12px\">• ${esc(x)}<\/div>`).j
